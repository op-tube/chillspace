    <title>ChillSpace Shop — Real SHEIN Items, Fake Checkout</title>
    <style>
        /* ===== same styles as before ===== */
        :root {
            --bg: #0f0f1a;
            --card-bg: #1a1a2e;
            --surface: #222240;
            --text: #e8e8f0;
            --text-secondary: #b0b0c8;
            --accent: #ff6b9d;
            --accent-glow: #ff6b9d66;
            --green: #4ade80;
            --green-glow: #4ade8066;
            --orange: #ffa94d;
            --blue: #6cb4ff;
            --purple: #c084fc;
            --border: #2a2a44;
            --radius: 16px;
            --radius-sm: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 20%, rgba(255, 107, 157, 0.06) 0%, transparent 55%),
                radial-gradient(ellipse at 75% 60%, rgba(108, 180, 255, 0.05) 0%, transparent 55%),
                radial-gradient(ellipse at 40% 80%, rgba(192, 132, 252, 0.04) 0%, transparent 50%);
            animation: bgShift 20s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%,
            100% {
                opacity: 0.8;
            }
            33% {
                opacity: 1;
            }
            66% {
                opacity: 0.6;
            }
        }
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            box-shadow: 0 0 80px rgba(0, 0, 0, 0.5);
        }
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 26, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #ff6b9d, #c084fc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px var(--accent-glow);
            animation: logoPulse 3s ease-in-out infinite;
            cursor: pointer;
        }
        @keyframes logoPulse {
            0%,
            100% {
                box-shadow: 0 4px 16px var(--accent-glow);
            }
            50% {
                box-shadow: 0 4px 28px rgba(255, 107, 157, 0.55);
            }
        }
        .header-title {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.3px;
            color: #fff;
        }
        .header-subtitle {
            font-size: 0.65rem;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-weight: 500;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .cart-btn {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--border);
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .cart-btn:active {
            transform: scale(0.92);
            background: #333358;
        }
        .cart-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--accent);
            color: #fff;
            font-size: 0.68rem;
            font-weight: 700;
            min-width: 20px;
            height: 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 5px;
            animation: badgeBounce 0.4s ease-out;
        }
        @keyframes badgeBounce {
            0% {
                transform: scale(0.3);
            }
            60% {
                transform: scale(1.25);
            }
            100% {
                transform: scale(1);
            }
        }
        .price-match-banner {
            margin: 12px 16px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #1a1a35, #222248);
            border: 1.5px solid #ffa94d55;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #ffa94d;
            letter-spacing: -0.2px;
            animation: bannerShimmer 4s ease-in-out infinite;
            cursor: default;
        }
        @keyframes bannerShimmer {
            0%,
            100% {
                border-color: #ffa94d55;
            }
            50% {
                border-color: #ffa94dbb;
                box-shadow: 0 0 24px #ffa94d22;
            }
        }
        .price-match-banner .icon {
            font-size: 1.4rem;
            flex-shrink: 0;
        }
        .price-match-banner .badge-tag {
            background: #ffa94d;
            color: #000;
            font-size: 0.6rem;
            padding: 3px 8px;
            border-radius: 20px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            margin-left: auto;
            flex-shrink: 0;
            animation: tagPulse 2s ease-in-out infinite;
        }
        @keyframes tagPulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.06);
            }
        }
        .category-tabs {
            display: flex;
            gap: 8px;
            padding: 6px 16px 10px;
            overflow-x: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-tabs::-webkit-scrollbar {
            display: none;
        }
        .cat-tab {
            flex-shrink: 0;
            padding: 9px 18px;
            border-radius: 24px;
            border: 1.5px solid var(--border);
            background: var(--surface);
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: -0.2px;
            transition: all 0.25s;
            white-space: nowrap;
        }
        .cat-tab.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 18px var(--accent-glow);
            font-weight: 700;
        }
        .cat-tab:active {
            transform: scale(0.94);
        }
        .products-scroll {
            flex: 1;
            padding: 0 16px 100px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .products-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .pull-refresh-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            height: 0;
            overflow: hidden;
            opacity: 0;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 600;
            transition: height 0.15s ease, opacity 0.15s ease;
            transform-origin: top center;
        }
        .pull-refresh-indicator.visible {
            opacity: 1;
        }
        .pull-refresh-spinner {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--accent);
            font-size: 0.85rem;
            transition: transform 0.2s ease;
        }
        .pull-refresh-spinner.ready {
            transform: rotate(180deg);
        }
        .pull-refresh-spinner.spinning {
            animation: pullSpin 0.7s linear infinite;
        }
        @keyframes pullSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .load-more-sentinel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px 0 6px;
            grid-column: 1 / -1;
        }
        .load-more-sentinel.hidden {
            display: none;
        }
        .load-more-spinner {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 2.5px solid var(--border);
            border-top-color: var(--accent);
            animation: pullSpin 0.7s linear infinite;
        }
        .product-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            box-shadow: var(--shadow);
        }
        .product-card:hover {
            border-color: #444;
            transform: translateY(-2px);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
        }
        .product-card:active {
            transform: scale(0.97);
            transition: transform 0.1s;
        }
        .product-image {
            width: 100%;
            aspect-ratio: 3/4;
            background: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .product-image .img-emoji {
            font-size: 4rem;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.5));
        }
        .shein-tag {
            position: absolute;
            top: 8px;
            left: 8px;
            background: #ffa94d;
            color: #000;
            font-size: 0.55rem;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(255, 169, 77, 0.4);
        }
        .product-info {
            padding: 10px 12px 12px;
        }
        .product-name {
            font-weight: 600;
            font-size: 0.85rem;
            line-height: 1.2;
            margin-bottom: 4px;
            color: #fff;
            letter-spacing: -0.2px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-pricing {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .original-price {
            text-decoration: line-through;
            color: #888;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .current-price {
            font-weight: 800;
            font-size: 1rem;
            color: var(--green);
            letter-spacing: -0.3px;
        }
        .savings-badge {
            font-size: 0.6rem;
            background: #4ade8022;
            color: var(--green);
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: 700;
        }
        .add-to-cart-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #6cb4ff, #4a8ed0);
            color: #fff;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            transition: all 0.25s;
            box-shadow: 0 4px 16px rgba(108, 180, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        .add-to-cart-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 8px rgba(108, 180, 255, 0.5);
        }
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease-out;
            padding: 20px;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal {
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 20px;
            padding: 28px 22px 22px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.7);
            animation: modalPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalPop {
            from {
                transform: scale(0.7) translateY(40px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        .modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ff6b9d, #ffa94d, #4ade80, #c084fc);
            border-radius: 20px 20px 0 0;
        }
        .modal-emoji {
            font-size: 5rem;
            animation: celebrateBounce 0.7s ease-out;
            display: block;
        }
        @keyframes celebrateBounce {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.3);
                opacity: 1;
            }
            70% {
                transform: scale(0.85);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .modal-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 10px 0 6px;
            letter-spacing: -0.4px;
            color: #fff;
        }
        .modal-saved {
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--green);
            letter-spacing: -1px;
            margin: 6px 0;
            text-shadow: 0 0 30px var(--green-glow);
            animation: savedGlow 1.5s ease-in-out infinite;
        }
        @keyframes savedGlow {
            0%,
            100% {
                text-shadow: 0 0 30px var(--green-glow);
            }
            50% {
                text-shadow: 0 0 50px rgba(74, 222, 128, 0.8), 0 0 80px rgba(74, 222, 128, 0.4);
            }
        }
        .modal-subtitle {
            color: var(--text-secondary);
            font-size: 0.85rem;
            line-height: 1.5;
            margin: 8px 0 16px;
            font-weight: 500;
        }
        .modal-subtitle .highlight {
            color: #fff;
            font-weight: 700;
            background: #4ade8020;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .modal-close {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 25px;
            border: none;
            background: var(--surface);
            color: #fff;
            font-weight: 700;

        .modal-close:active {

            background: #333358;
        }
        .cart-items-list {
            list-style: none;
            margin: 16px 0;
            text-align: left;
            max-height: 40vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 8px;
            border-bottom: 1px solid var(--border);
            font-size: 0.8rem;

        .cart-item-emoji {
            font-size: 2rem;
            flex-shrink: 0;
        }
        .cart-item-details {
            flex: 1;
        }
        .cart-item-name {
            font-weight: 600;
            color: #fff;
            font-size: 0.8rem;
        }
        .cart-item-prices {
            display: flex;
            gap: 8px;
            font-size: 0.7rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .cart-item-original {
            text-decoration: line-through;
            color: #888;
        }
        .cart-item-matched {
            color: var(--green);
            font-weight: 700;
        }
        .cart-item-save {
            color: #ffa94d;
            font-size: 0.65rem;
            font-weight: 600;
        }
        .remove-item-btn {
            background: none;

            color: #ff6b9d;
            font-size: 1.2rem;

            border-radius: 50%;
            transition: background 0.2s;
        }

        .cart-summary {
            margin: 12px 0 6px;

            justify-content: space-between;

        }
        .cart-total-savings {
            color: var(--green);
            font-size: 1.3rem;
            font-weight: 900;
        }
        .cart-buy-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #ff6b9d, #e85580);
            color: #fff;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 8px;
            box-shadow: 0 6px 24px rgba(255, 107, 157, 0.4);
            transition: all 0.2s;
        }
        .cart-buy-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }
        .cart-empty-message {
            padding: 30px 0;
            color: var(--text-secondary);
            text-align: center;
        }
        .empty-cart-text-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 0.7rem;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 8px;
        }
        .savings-footer {
            position: sticky;
            bottom: 0;
            z-index: 90;
            background: rgba(15, 15, 26, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px 18px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;

        }
        .savings-footer .total-saved {
            font-weight: 800;
            color: var(--green);
            font-size: 1rem;

        }
        .savings-footer .label {
            font-size: 0.65rem;

        }
        .confetti-piece {
            position: fixed;
            z-index: 300;
            pointer-events: none;
            animation: confettiFall 1.8s ease-out forwards;
            font-size: 1.4rem;
        }
        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg) scale(1);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg) scale(0.3);
                opacity: 0;
            }
        }
        @media (max-width: 400px) {
            .products-grid {
                gap: 8px;
            }
            .product-card {

                font-size: 0.75rem;

            .current-price {

            .add-to-cart-btn {

                padding: 9px;
            }
            .modal {
                padding: 22px 16px 18px;
            }
            .modal-saved {
                font-size: 1.8rem;

        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">🛍️</div>
                <div>
                    <div class="header-title">ChillSpace Shop</div>
                    <div class="header-subtitle">by chill-space.pages.dev</div>
                </div>
            </div>
            <div class="header-actions">
                <button class="cart-btn" id="cartBtn" title="Your cart">
                    🛒
                    <span class="cart-badge" id="cartBadge" style="display:none;">0</span>
                </button>
            </div>
        </header>

        <!-- SHEIN Price Match Banner -->
        <div class="price-match-banner">
            <span class="icon">💸</span>
            <span>SHEIN Price Match™ — We match & beat every price*</span>
            <span class="badge-tag">ACTIVE</span>
        </div>

        <!-- Category Tabs -->
        <div class="category-tabs" id="categoryTabs">
            <button class="cat-tab active" data-cat="all">🛒 All</button>
            <button class="cat-tab" data-cat="clothes">👕 Clothes</button>
            <button class="cat-tab" data-cat="homeware">🏠 Homeware</button>
            <button class="cat-tab" data-cat="accessories">💍 Accessories</button>
            <button class="cat-tab" data-cat="beauty">💄 Beauty</button>
            <button class="cat-tab" data-cat="party">🎉 Party</button>
        </div>

        <!-- Products -->
        <div class="products-scroll" id="productsScroll">
            <div class="pull-refresh-indicator" id="pullRefreshIndicator">
                <div class="pull-refresh-spinner" id="pullRefreshSpinner">↓</div>
                <span id="pullRefreshLabel">Pull to shuffle</span>
            </div>
            <div class="products-grid" id="productsGrid"></div>
            <div class="load-more-sentinel" id="loadMoreSentinel">
                <div class="load-more-spinner"></div>
            </div>
        </div>

        <!-- Savings Footer -->
        <div class="savings-footer">
            <div>
                <div class="label">💰 Total Saved Today</div>
                <div class="total-saved" id="totalSaved">$0.00</div>
            </div>
            <div style="text-align:right;">
                <div class="label">🧠 Dopamine Hits</div>
                <div style="font-weight:700;color:#c084fc;font-size:1rem;" id="dopamineCount">0</div>
            </div>
        </div>
    </div>

    <!-- Savings Overlay -->
    <div class="overlay" id="savingsOverlay" style="display:none;">
        <div class="modal" id="savingsModal">
            <span class="modal-emoji" id="modalEmoji">🎉</span>
            <div class="modal-title" id="modalTitle">You just saved</div>
            <div class="modal-saved" id="modalSaved">$0.00</div>
            <div class="modal-subtitle" id="modalSubtitle">
                ...by <span class="highlight">not buying</span> these items!<br>
                That money is still in your bank account. 🏦✨
            </div>
            <button class="modal-close" id="savingsModalClose">🫶 Keep Saving</button>
        </div>
    </div>

    <!-- Cart Overlay -->
    <div class="overlay" id="cartOverlay" style="display:none;">
        <div class="modal" id="cartModal">
            <h2 style="margin-bottom:8px;color:#fff;">🛒 Your Cart</h2>
            <div id="cartContent"></div>
            <button class="modal-close" id="cartCloseBtn" style="margin-top:8px;">Close</button>
        </div>
    </div>

    <script src="shein-products.js"></script>
    <script src="placeholder-image-generator.js"></script>
    <script>
        (function() {
            // Dataset comes from shein-products.js (pure product data, no images)
            const products = SHEIN_PRODUCTS;
            // ──────────────────────────────────────────────────────────────
            // PRODUCT DATABASE — 100+ real SHEIN items (no adult content)
            // Removed: sexy lingerie, kept only neutral products.
            // ──────────────────────────────────────────────────────────────

            // ──────────────────────────────────────────────────────────────
            // STATE
            // ──────────────────────────────────────────────────────────────
            let activeCategory = 'all';
            let cartItems = [];
            let totalSavedLifetime = 0;
            let dopamineHits = 0;

            // ──────────────────────────────────────────────────────────────
            // DOM REFS
            // ──────────────────────────────────────────────────────────────
            const productsGrid = document.getElementById('productsGrid');
            const categoryTabs = document.getElementById('categoryTabs');
            const cartBadge = document.getElementById('cartBadge');
            const cartBtn = document.getElementById('cartBtn');
            const savingsOverlay = document.getElementById('savingsOverlay');
            const modalEmoji = document.getElementById('modalEmoji');
            const modalSaved = document.getElementById('modalSaved');
            const modalTitle = document.getElementById('modalTitle');
            const modalSubtitle = document.getElementById('modalSubtitle');
            const savingsModalClose = document.getElementById('savingsModalClose');
            const totalSavedEl = document.getElementById('totalSaved');
            const dopamineCountEl = document.getElementById('dopamineCount');
            const cartOverlay = document.getElementById('cartOverlay');
            const cartContent = document.getElementById('cartContent');
            const cartCloseBtn = document.getElementById('cartCloseBtn');
            const productsScroll = document.getElementById('productsScroll');
            const pullRefreshIndicator = document.getElementById('pullRefreshIndicator');
            const pullRefreshSpinner = document.getElementById('pullRefreshSpinner');
            const pullRefreshLabel = document.getElementById('pullRefreshLabel');
            const loadMoreSentinel = document.getElementById('loadMoreSentinel');

            // ──────────────────────────────────────────────────────────────
            // RANDOM ORDER — Fisher–Yates shuffle
            // ──────────────────────────────────────────────────────────────
            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            // ──────────────────────────────────────────────────────────────
            // RENDER PRODUCTS — batched/incremental so 10,000+ items stay smooth
            // ──────────────────────────────────────────────────────────────
            const BATCH_SIZE = 30;
            let currentList = [];
            let renderedCount = 0;

            function buildCardHTML(p) {
                const hasDiscount = p.originalPrice > p.price;
                const savingsPercent = hasDiscount ? Math.round((1 - p.price / p.originalPrice) * 100) : 0;
                // Image comes from the standalone generator, not the dataset —
                // dataset and image logic are fully decoupled.
                const adImageUrl = generateAdBannerImage();
                const imageHtml =
                    `<img src="${adImageUrl}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />`;
                const fallbackEmoji = '🛍️';
                return `
                <div class="product-card" data-id="${p.id}">
                  <div class="product-image">
                    <span class="shein-tag">SHEIN MATCH</span>
                    ${imageHtml}
                    <span class="img-emoji" style="display:none;">${fallbackEmoji}</span>
                  </div>
                  <div class="product-info">
                    <div class="product-name">${p.name}</div>
                    <div class="product-pricing">
                      ${hasDiscount ? `<span class="original-price">$${p.originalPrice.toFixed(2)}</span>` : ''}
                      <span class="current-price">$${p.price.toFixed(2)}</span>
                      ${hasDiscount ? `<span class="savings-badge">-${savingsPercent}%</span>` : ''}
                    </div>
                    <button class="add-to-cart-btn" data-id="${p.id}">
                      🛒 ADD TO CART
                    </button>
                  </div>
                </div>
              `;
            }

            function bindCardButtons(container) {
                container.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const productId = parseInt(btn.dataset.id);
                        addToCart(productId);
                    });
                });
            }

            // Fresh render: recompute the filtered+shuffled list and show the first batch
            function renderProducts() {
                currentList = activeCategory === 'all' ?
                    products :
                    products.filter(p => p.category === activeCategory);

                renderedCount = 0;
                productsGrid.innerHTML = '';
                loadMoreSentinel.classList.remove('hidden');
                loadNextBatch();
            }

            // Append the next batch of cards (used for both initial render and infinite scroll)
            function loadNextBatch() {
                if (renderedCount >= currentList.length) {
                    loadMoreSentinel.classList.add('hidden');
                    return;
                }
                const nextItems = currentList.slice(renderedCount, renderedCount + BATCH_SIZE);
                const frag = document.createElement('div');
                frag.innerHTML = nextItems.map(buildCardHTML).join('');
                while (frag.firstElementChild) {
                    productsGrid.appendChild(frag.firstElementChild);
                }
                bindCardButtons(productsGrid);
                renderedCount += nextItems.length;
                if (renderedCount >= currentList.length) {
                    loadMoreSentinel.classList.add('hidden');
                }
            }

            // Infinite scroll: load more once the sentinel nears the viewport
            const infiniteScrollObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) loadNextBatch();
                });
            }, { root: productsScroll, rootMargin: '400px' });
            infiniteScrollObserver.observe(loadMoreSentinel);

            // ──────────────────────────────────────────────────────────────
            // PULL TO REFRESH — reshuffles the catalog into a new random order
            // ──────────────────────────────────────────────────────────────
            (function setupPullToRefresh() {
                const THRESHOLD = 70;
                const MAX_PULL = 110;
                let startY = 0;
                let pulling = false;
                let refreshing = false;

                productsScroll.addEventListener('touchstart', (e) => {
                    if (productsScroll.scrollTop <= 0 && !refreshing) {
                        startY = e.touches[0].clientY;
                        pulling = true;
                    }
                }, { passive: true });

                productsScroll.addEventListener('touchmove', (e) => {
                    if (!pulling || refreshing) return;
                    const delta = e.touches[0].clientY - startY;
                    if (delta <= 0) return;
                    const pull = Math.min(delta, MAX_PULL);
                    pullRefreshIndicator.style.height = pull + 'px';
                    pullRefreshIndicator.classList.add('visible');
                    if (pull >= THRESHOLD) {
                        pullRefreshSpinner.classList.add('ready');
                        pullRefreshLabel.textContent = 'Release to shuffle';
                    } else {
                        pullRefreshSpinner.classList.remove('ready');
                        pullRefreshLabel.textContent = 'Pull to shuffle';
                    }
                }, { passive: true });

                productsScroll.addEventListener('touchend', () => {
                    if (!pulling || refreshing) return;
                    pulling = false;
                    const pulledEnough = pullRefreshIndicator.classList.contains('visible') &&
                        pullRefreshSpinner.classList.contains('ready');
                    if (pulledEnough) {
                        doRefresh();
                    } else {
                        resetPullIndicator();
                    }
                });

                function resetPullIndicator() {
                    pullRefreshIndicator.style.height = '0px';
                    pullRefreshIndicator.classList.remove('visible');
                    pullRefreshSpinner.classList.remove('ready', 'spinning');
                    pullRefreshLabel.textContent = 'Pull to shuffle';
                }

                function doRefresh() {
                    refreshing = true;
                    pullRefreshIndicator.style.height = '56px';
                    pullRefreshSpinner.classList.add('spinning');
                    pullRefreshLabel.textContent = 'Shuffling…';
                    if (navigator.vibrate) navigator.vibrate(12);
                    setTimeout(() => {
                        shuffleArray(products);
                        renderProducts();
                        productsScroll.scrollTop = 0;
                        refreshing = false;
                        resetPullIndicator();
                    }, 500);
                }
            })();

            // ──────────────────────────────────────────────────────────────
            // CART MANAGEMENT
            // ──────────────────────────────────────────────────────────────
            function addToCart(productId) {
                const product = products.find(p => p.id === productId);
                if (!product) return;
                if (cartItems.find(i => i.id === product.id)) {
                    if (navigator.vibrate) navigator.vibrate(10);
                    return;
                }
                cartItems.push({
                    id: product.id,
                    name: product.name,
                    emoji: '🛍️',
                    originalPrice: product.originalPrice,
                    price: product.price,
                });
                updateCartBadge();
                if (navigator.vibrate) navigator.vibrate(15);
                playAddToCartSound();
            }

            function removeFromCart(index) {
                cartItems.splice(index, 1);
                updateCartBadge();
                renderCartOverlay();
            }

            function clearCart() {
                cartItems = [];
                updateCartBadge();
                if (cartOverlay.style.display === 'flex') renderCartOverlay();
            }

            function updateCartBadge() {
                const count = cartItems.length;
                if (count > 0) {
                    cartBadge.style.display = 'flex';
                    cartBadge.textContent = count;
                    cartBadge.style.animation = 'none';
                    cartBadge.offsetHeight;
                    cartBadge.style.animation = 'badgeBounce 0.4s ease-out';
                } else {
                    cartBadge.style.display = 'none';
                }
            }

            // ──────────────────────────────────────────────────────────────
            // CART OVERLAY
            // ──────────────────────────────────────────────────────────────
            function renderCartOverlay() {
                if (cartItems.length === 0) {
                    cartContent.innerHTML = `
                <div class="cart-empty-message">
                  <span style="font-size:3rem;">🛒</span>
                  <p>Your cart is empty.<br>But your wallet is full! 💰</p>
                </div>
              `;
                    return;
                }

                const totalOriginal = cartItems.reduce((sum, item) => sum + item.originalPrice, 0);
                const totalMatched = cartItems.reduce((sum, item) => sum + item.price, 0);
                const totalSavings = totalOriginal - totalMatched;

                let itemsHtml = cartItems.map((item, index) => `
                <li class="cart-item">
                  <span class="cart-item-emoji">${item.emoji}</span>
                  <div class="cart-item-details">
                    <div class="cart-item-name">${item.name}</div>
                    <div class="cart-item-prices">
                      <span class="cart-item-original">$${item.originalPrice.toFixed(2)}</span>
                      <span class="cart-item-matched">$${item.price.toFixed(2)}</span>
                      <span class="cart-item-save">Save $${(item.originalPrice - item.price).toFixed(2)}</span>
                    </div>
                  </div>
                  <button class="remove-item-btn" data-index="${index}" title="Remove">✕</button>
                </li>
              `).join('');

                cartContent.innerHTML = `
                <ul class="cart-items-list">${itemsHtml}</ul>
                <div class="cart-summary">
                  <span>Cart total savings:</span>
                  <span class="cart-total-savings">$${totalSavings.toFixed(2)}</span>
                </div>
                <button class="cart-buy-btn" id="cartBuyBtn">
                  ⚡ BUY NOW & SAVE $${totalSavings.toFixed(2)}
                </button>
                <button class="empty-cart-text-btn" id="emptyCartBtn">Empty Cart</button>
              `;

                document.getElementById('cartBuyBtn').addEventListener('click', () => {
                    const savings = totalSavings;
                    checkoutCart(savings, cartItems.length);
                });
                document.getElementById('emptyCartBtn').addEventListener('click', clearCart);

                document.querySelectorAll('.remove-item-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const index = parseInt(btn.dataset.index);
                        removeFromCart(index);
                    });
                });
            }

            function openCartOverlay() {
                renderCartOverlay();
                cartOverlay.style.display = 'flex';
            }

            function closeCartOverlay() {
                cartOverlay.style.display = 'none';
            }

            // ──────────────────────────────────────────────────────────────
            // CHECKOUT (dopamine hit)
            // ──────────────────────────────────────────────────────────────
            function checkoutCart(totalSaved, itemCount) {
                totalSavedLifetime += totalSaved;
                dopamineHits++;
                updateFooterStats();

                modalEmoji.textContent = '🤑';
                modalTitle.textContent = 'You just saved';
                modalSaved.textContent = `$${totalSaved.toFixed(2)}`;
                modalSubtitle.innerHTML = `
              ...by <span class="highlight">not buying</span> ${itemCount} item(s)!<br>
              That $${totalSaved.toFixed(2)} is still in your bank account. 🏦✨
            `;
                savingsOverlay.style.display = 'flex';
                modalEmoji.style.animation = 'none';
                modalEmoji.offsetHeight;
                modalEmoji.style.animation = 'celebrateBounce 0.7s ease-out';

                spawnConfetti();
                if (navigator.vibrate) navigator.vibrate([30, 50, 30, 50, 60]);
                playDopamineSound();

                cartItems = [];
                updateCartBadge();
                closeCartOverlay();
            }

            // ──────────────────────────────────────────────────────────────
            // MODAL CLOSES
            // ──────────────────────────────────────────────────────────────
            savingsModalClose.addEventListener('click', () => savingsOverlay.style.display = 'none');
            savingsOverlay.addEventListener('click', (e) => {
                if (e.target === savingsOverlay) savingsOverlay.style.display = 'none';
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && savingsOverlay.style.display === 'flex') savingsOverlay.style.display = 'none';
            });

            cartCloseBtn.addEventListener('click', closeCartOverlay);
            cartOverlay.addEventListener('click', (e) => {
                if (e.target === cartOverlay) closeCartOverlay();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && cartOverlay.style.display === 'flex') closeCartOverlay();
            });

            cartBtn.addEventListener('click', openCartOverlay);

            // ──────────────────────────────────────────────────────────────
            // FOOTER STATS
            // ──────────────────────────────────────────────────────────────
            function updateFooterStats() {
                totalSavedEl.textContent = `$${totalSavedLifetime.toFixed(2)}`;
                dopamineCountEl.textContent = dopamineHits;
                totalSavedEl.style.transform = 'scale(1.2)';
                setTimeout(() => { totalSavedEl.style.transform = 'scale(1)'; }, 200);
                dopamineCountEl.style.transform = 'scale(1.2)';
                setTimeout(() => { dopamineCountEl.style.transform = 'scale(1)'; }, 200);
            }

            // ──────────────────────────────────────────────────────────────
            // CONFETTI
            // ──────────────────────────────────────────────────────────────
            function spawnConfetti() {
                const emojis = ['💰', '💸', '✨', '🤑', '💵', '🎉', '🪙', '💎', '🌟', '🔥', '😎', '💖'];
                const count = 30;
                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('span');
                    piece.className = 'confetti-piece';
                    piece.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.top = -(Math.random() * 60 + 10) + 'px';
                    piece.style.animationDuration = (Math.random() * 1.5 + 1.2) + 's';
                    piece.style.animationDelay = Math.random() * 0.6 + 's';
                    piece.style.fontSize = (Math.random() * 2 + 1.2) + 'rem';
                    document.body.appendChild(piece);
                    const dur = parseFloat(piece.style.animationDuration) + parseFloat(piece.style.animationDelay);
                    setTimeout(() => {
                        if (piece.parentNode) piece.parentNode.removeChild(piece);
                    }, dur * 1000 + 300);
                }
            }

            // ──────────────────────────────────────────────────────────────
            // SOUNDS
            // ──────────────────────────────────────────────────────────────
            function playDopamineSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(900, ctx.currentTime + 0.1);
                    osc.frequency.linearRampToValueAtTime(1200, ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.06, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.3);
                } catch (e) {}
            }

            function playAddToCartSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(700, ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.04, ctx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                } catch (e) {}
            }

            // ──────────────────────────────────────────────────────────────
            // CATEGORY TABS
            // ──────────────────────────────────────────────────────────────
            categoryTabs.addEventListener('click', (e) => {
                const tab = e.target.closest('.cat-tab');
                if (!tab) return;
                const cat = tab.dataset.cat;
                if (cat === activeCategory) return;
                activeCategory = cat;
                categoryTabs.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById('productsScroll').scrollTop = 0;
                renderProducts();
            });

            // ──────────────────────────────────────────────────────────────
            // EASTER EGG: logo clicks
            // ──────────────────────────────────────────────────────────────
            let logoClicks = 0;
            document.querySelector('.header-logo').addEventListener('click', () => {
                logoClicks++;
                if (logoClicks >= 5) {
                    logoClicks = 0;
                    totalSavedLifetime += 1000;
                    dopamineHits += 10;
                    updateFooterStats();
                    spawnConfetti();
                    alert(
                        '🌟 SECRET UNLOCKED: You just saved an EXTRA $1,000 by not buying anything!\n\nChillSpace Shop — the gift that keeps on giving. 😎');
                }
                setTimeout(() => { logoClicks = 0; }, 2000);
            });

            // ──────────────────────────────────────────────────────────────
            // INIT
            // ──────────────────────────────────────────────────────────────
            function init() {
                shuffleArray(products);
                renderProducts();
                updateFooterStats();
                updateCartBadge();
                savingsOverlay.style.display = 'none';
                cartOverlay.style.display = 'none';
            }

            init();
            console.log(`🛍️ ChillSpace Shop loaded with ${products.length.toLocaleString()} safe SHEIN items, shuffled and ready.`);
        })();
    </script>
</body>
