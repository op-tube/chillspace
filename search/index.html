<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vibe Search</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: #0f172a;
            color: #e2e8f0;
        }

        /* ---- CONTAINER ---- */
        .container {
            width: 100%;
            max-width: 820px;
            padding: 0 24px;
            margin: 0 auto;
        }

        /* ---- HEADER / TOP BAR ---- */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 0 12px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        body.dark .top-bar {
            border-bottom-color: rgba(255, 255, 255, 0.06);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: inherit;
        }

        .logo i {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 30px;
        }

        .logo span {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .theme-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
            padding: 8px 12px;
            border-radius: 40px;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        body.dark .theme-toggle {
            color: #94a3b8;
        }

        body.dark .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* ---- SEARCH SECTION ---- */
        .search-section {
            padding: 40px 0 20px;
            text-align: center;
        }

        .search-section h1 {
            font-size: 48px;
            font-weight: 700;
            letter-spacing: -1.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-section .sub {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 28px;
        }

        body.dark .search-section .sub {
            color: #94a3b8;
        }

        /* ---- SEARCH BAR ---- */
        .search-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            border-radius: 60px;
            padding: 4px 4px 4px 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            border: 2px solid transparent;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.3s;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
        }

        .search-box:focus-within {
            border-color: #6366f1;
            box-shadow: 0 4px 28px rgba(99, 102, 241, 0.15), 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        body.dark .search-box {
            background: #1e293b;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        }

        body.dark .search-box:focus-within {
            border-color: #818cf8;
            box-shadow: 0 4px 28px rgba(99, 102, 241, 0.2);
        }

        .search-box i {
            color: #94a3b8;
            font-size: 18px;
        }

        body.dark .search-box i {
            color: #64748b;
        }

        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            padding: 16px 16px 16px 14px;
            font-size: 17px;
            background: transparent;
            color: inherit;
            font-family: inherit;
        }

        .search-box input::placeholder {
            color: #94a3b8;
        }

        .search-box .clear-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 8px 8px 8px 4px;
            display: none;
        }

        .search-box .clear-btn.visible {
            display: block;
        }

        .search-box .search-btn {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            color: #fff;
            font-size: 18px;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-box .search-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.35);
        }

        .search-box .search-btn:active {
            transform: scale(0.97);
        }

        .search-box .search-btn i {
            color: #fff;
            font-size: 16px;
        }

        /* ---- STATUS / INFO ---- */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 8px;
            font-size: 14px;
            color: #94a3b8;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        body.dark .status-bar {
            color: #64748b;
            border-bottom-color: rgba(255, 255, 255, 0.04);
        }

        .status-bar .count {
            font-weight: 500;
        }

        .status-bar .actions {
            display: flex;
            gap: 12px;
        }

        .status-bar .actions button {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 13px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 20px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-bar .actions button:hover {
            background: rgba(0, 0, 0, 0.04);
            color: #475569;
        }

        body.dark .status-bar .actions button:hover {
            background: rgba(255, 255, 255, 0.04);
            color: #cbd5e1;
        }

        /* ---- RESULTS ---- */
        .results {
            padding: 12px 0 60px;
        }

        .result-item {
            padding: 20px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
            animation: fadeUp 0.35s ease forwards;
            opacity: 0;
        }

        body.dark .result-item {
            border-bottom-color: rgba(255, 255, 255, 0.04);
        }

        .result-item:nth-child(1) {
            animation-delay: 0.02s;
        }
        .result-item:nth-child(2) {
            animation-delay: 0.06s;
        }
        .result-item:nth-child(3) {
            animation-delay: 0.10s;
        }
        .result-item:nth-child(4) {
            animation-delay: 0.14s;
        }
        .result-item:nth-child(5) {
            animation-delay: 0.18s;
        }
        .result-item:nth-child(6) {
            animation-delay: 0.22s;
        }
        .result-item:nth-child(7) {
            animation-delay: 0.26s;
        }
        .result-item:nth-child(8) {
            animation-delay: 0.30s;
        }
        .result-item:nth-child(9) {
            animation-delay: 0.34s;
        }
        .result-item:nth-child(10) {
            animation-delay: 0.38s;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-item .title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .result-item .title a {
            color: #1a0dab;
            text-decoration: none;
        }

        .result-item .title a:hover {
            text-decoration: underline;
        }

        body.dark .result-item .title a {
            color: #818cf8;
        }

        .result-item .url {
            font-size: 13px;
            color: #1a7c3a;
            margin-bottom: 4px;
            word-break: break-all;
        }

        body.dark .result-item .url {
            color: #4ade80;
        }

        .result-item .snippet {
            font-size: 15px;
            line-height: 1.6;
            color: #334155;
        }

        body.dark .result-item .snippet {
            color: #cbd5e1;
        }

        .result-item .snippet em {
            background: #fef08a;
            font-style: normal;
            padding: 0 2px;
            border-radius: 2px;
        }

        body.dark .result-item .snippet em {
            background: #854d0e;
            color: #fde047;
        }

        .no-results {
            text-align: center;
            padding: 60px 0;
            color: #94a3b8;
        }

        .no-results i {
            font-size: 48px;
            margin-bottom: 16px;
            display: block;
            opacity: 0.4;
        }

        .no-results h3 {
            font-size: 20px;
            font-weight: 500;
            color: #475569;
        }

        body.dark .no-results h3 {
            color: #94a3b8;
        }

        /* ---- LOADING ---- */
        .loading {
            text-align: center;
            padding: 60px 0;
            display: none;
        }

        .loading .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .loading p {
            color: #94a3b8;
            font-size: 15px;
        }

        /* ---- FOOTER ---- */
        .footer {
            margin-top: auto;
            padding: 24px 0 32px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            width: 100%;
        }

        body.dark .footer {
            border-top-color: rgba(255, 255, 255, 0.04);
            color: #64748b;
        }

        .footer a {
            color: #6366f1;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 640px) {
            .search-section h1 {
                font-size: 32px;
            }
            .search-box {
                padding: 4px 4px 4px 16px;
                border-radius: 40px;
            }
            .search-box input {
                font-size: 15px;
                padding: 14px 10px 14px 8px;
            }
            .search-box .search-btn {
                padding: 10px 16px;
                font-size: 15px;
            }
            .search-box .search-btn span {
                display: none;
            }
            .result-item .title {
                font-size: 16px;
            }
            .result-item .snippet {
                font-size: 14px;
            }
            .status-bar {
                flex-direction: column;
                gap: 8px;
                align-items: flex-start;
            }
            .top-bar {
                padding: 14px 0 10px;
            }
            .logo {
                font-size: 20px;
            }
        }

        @media (max-width: 400px) {
            .search-section h1 {
                font-size: 26px;
            }
            .search-box input {
                font-size: 14px;
                padding: 12px 6px 12px 4px;
            }
            .search-box .search-btn {
                padding: 8px 14px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <!-- ---- TOP BAR ---- -->
    <div class="container">
        <div class="top-bar">
            <a href="#" class="logo" id="logoLink">
                <i class="fas fa-compass"></i>
                <span>Vibe</span>
            </a>
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </div>

    <!-- ---- SEARCH ---- -->
    <div class="container">
        <div class="search-section">
            <h1>vibe search</h1>
            <p class="sub">crawl · index · discover</p>

            <form class="search-box" id="searchForm" role="search">
                <i class="fas fa-search"></i>
                <input
                type="text"
                id="searchInput"
                placeholder="Search the web…"
                autocomplete="off"
                spellcheck="false"
                autofocus
                />
                <button type="button" class="clear-btn" id="clearBtn" aria-label="Clear">
                    <i class="fas fa-times-circle"></i>
                </button>
                <button type="submit" class="search-btn">
                    <i class="fas fa-arrow-right"></i>
                    <span>Search</span>
                </button>
            </form>
        </div>
    </div>

    <!-- ---- STATUS ---- -->
    <div class="container">
        <div class="status-bar" id="statusBar">
            <span class="count" id="resultCount">Ready to search</span>
            <div class="actions">
                <button id="crawlBtn" title="Crawl a few sample sites to build the index">
                    <i class="fas fa-cloud-upload-alt"></i> Crawl
                </button>
                <button id="resetBtn" title="Reset the index">
                    <i class="fas fa-undo"></i> Reset
                </button>
            </div>
        </div>
    </div>

    <!-- ---- RESULTS ---- -->
    <div class="container">
        <div class="results" id="resultsContainer">
            <!-- Results rendered here -->
            <div class="no-results" id="emptyState">
                <i class="fas fa-globe"></i>
                <h3>Discover something new</h3>
                <p style="margin-top:6px; font-size:15px; color:#94a3b8;">
                    Try a search above, or click <strong>Crawl</strong> to index some pages.
                </p>
            </div>
            <div class="loading" id="loadingIndicator">
                <div class="spinner"></div>
                <p>Searching the index…</p>
            </div>
        </div>
    </div>

    <!-- ---- FOOTER ---- -->
    <div class="footer">
        <div class="container">
            made with <i class="fas fa-heart" style="color:#ef4444;font-size:12px;"></i>
            · <a href="#" id="aboutLink">about</a>
            · built with flask &amp; tf‑idf
        </div>
    </div>

    <script>
        <script>
    (function() {
        'use strict';

        // ---- DOM refs ----
        const form = document.getElementById('searchForm');
        const input = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const emptyState = document.getElementById('emptyState');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultCount = document.getElementById('resultCount');
        const themeToggle = document.getElementById('themeToggle');
        const crawlBtn = document.getElementById('crawlBtn');
        const resetBtn = document.getElementById('resetBtn');
        const logoLink = document.getElementById('logoLink');

        // ---- state ----
        let currentQuery = '';
        let isDark = localStorage.getItem('vibeTheme') === 'dark';
        let searchIndex = []; // Holds { url, title, content, tokens }
        let isIndexLoaded = false;

        // ---- init theme ----
        if (isDark) {
            document.body.classList.add('dark');
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('dark', isDark);
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
            localStorage.setItem('vibeTheme', isDark ? 'dark' : 'light');
        });

        // ---- clear button ----
        input.addEventListener('input', () => {
            clearBtn.classList.toggle('visible', input.value.length > 0);
        });
        clearBtn.addEventListener('click', () => {
            input.value = '';
            clearBtn.classList.remove('visible');
            input.focus();
        });

        // ---- load the static index ----
        async function loadIndex() {
            try {
                resultCount.textContent = '📂 Loading index…';
                const res = await fetch('/index.json');
                if (!res.ok) throw new Error('Index not found. Run the crawler locally first.');
                searchIndex = await res.json();
                isIndexLoaded = true;
                resultCount.textContent = `✅ Loaded ${searchIndex.length} pages. Ready to search.`;
                return true;
            } catch (err) {
                resultCount.textContent = '⚠️ ' + err.message;
                searchIndex = [];
                isIndexLoaded = false;
                return false;
            }
        }

        // ---- tokenizer helper ----
        function tokenize(text) {
            return text.toLowerCase().replace(/[^a-z0-9\s]/g, '').split(/\s+/).filter(w => w.length > 1);
        }

        // ---- TF-IDF scoring (client side) ----
        function search(query) {
            if (!isIndexLoaded || searchIndex.length === 0) return [];

            const queryTokens = tokenize(query);
            if (queryTokens.length === 0) return [];

            // Build term frequency for query
            const queryTF = {};
            queryTokens.forEach(t => { queryTF[t] = (queryTF[t] || 0) + 1; });

            // Calculate term frequency in each doc and doc frequency (DF)
            const docScores = [];
            const docFreq = {};

            searchIndex.forEach((doc, idx) => {
                const docTokens = doc.tokens || tokenize((doc.title || '') + ' ' + (doc.content || ''));
                // Cache tokens for performance
                if (!doc.tokens) doc.tokens = docTokens;
                
                const tf = {};
                docTokens.forEach(t => { tf[t] = (tf[t] || 0) + 1; });
                
                let score = 0;
                queryTokens.forEach(term => {
                    if (tf[term]) {
                        // Term Frequency in doc (log normalization)
                        const tfWeight = 1 + Math.log(tf[term]);
                        // Inverse Document Frequency (computed globally later)
                        docFreq[term] = (docFreq[term] || 0) + 1;
                        // Accumulate raw TF for now
                        score += tfWeight;
                    }
                });
                docScores.push({ idx, score, tf });
            });

            // Apply IDF weighting globally
            const totalDocs = searchIndex.length;
            docScores.forEach(item => {
                let finalScore = 0;
                queryTokens.forEach(term => {
                    const df = docFreq[term] || 0;
                    const idf = df > 0 ? Math.log((totalDocs + 1) / df) : 0;
                    const tfWeight = item.tf[term] ? 1 + Math.log(item.tf[term]) : 0;
                    finalScore += tfWeight * idf;
                });
                item.score = finalScore;
            });

            // Sort by score descending and return top 20
            const sorted = docScores
                .filter(d => d.score > 0)
                .sort((a, b) => b.score - a.score)
                .slice(0, 20);

            return sorted.map(d => ({
                ...searchIndex[d.idx],
                score: d.score
            }));
        }

        // ---- performSearch (client-side) ----
        async function performSearch(q) {
            if (!isIndexLoaded) {
                await loadIndex();
                if (!isIndexLoaded) return;
            }

            currentQuery = q;
            emptyState.style.display = 'none';
            loadingIndicator.style.display = 'block';
            resultCount.textContent = '🔍 Searching…';
            document.title = `"${q}" · Vibe Search`;

            // Simulate tiny delay for UI feedback
            await new Promise(r => setTimeout(r, 120));

            const results = search(q);
            loadingIndicator.style.display = 'none';

            if (results.length === 0) {
                showEmptyState();
                resultCount.textContent = `😕 No results for “${q}”`;
                return;
            }

            renderResults(results, q);
            resultCount.textContent = `✨ ${results.length} result${results.length !== 1 ? 's' : ''} for “${q}”`;
        }

        // ---- renderResults ----
        function renderResults(results, query) {
            document.querySelectorAll('.result-item').forEach(el => el.remove());
            emptyState.style.display = 'none';
            loadingIndicator.style.display = 'none';

            const fragment = document.createDocumentFragment();
            results.forEach((r) => {
                const div = document.createElement('div');
                div.className = 'result-item';

                const titleDiv = document.createElement('div');
                titleDiv.className = 'title';
                const a = document.createElement('a');
                a.href = r.url || '#';
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.textContent = r.title || r.url || 'Untitled';
                titleDiv.appendChild(a);
                div.appendChild(titleDiv);

                const urlDiv = document.createElement('div');
                urlDiv.className = 'url';
                urlDiv.textContent = r.url || '';
                div.appendChild(urlDiv);

                const snippetDiv = document.createElement('div');
                snippetDiv.className = 'snippet';
                const content = r.content || '';
                const snippet = content.length > 200 ? content.slice(0, 200) + '…' : content;
                snippetDiv.innerHTML = highlightText(snippet, query);
                div.appendChild(snippetDiv);

                fragment.appendChild(div);
            });
            resultsContainer.appendChild(fragment);
        }

        function highlightText(text, query) {
            if (!text || !query) return text;
            const words = query.split(/\s+/).filter(w => w.length > 1);
            let result = text;
            words.forEach(word => {
                const regex = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
                result = result.replace(regex, '<em>$1</em>');
            });
            return result;
        }

        function showEmptyState() {
            document.querySelectorAll('.result-item').forEach(el => el.remove());
            loadingIndicator.style.display = 'none';
            emptyState.style.display = 'block';
        }

        // ---- form submit ----
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;
            performSearch(q);
        });

        // ---- Crawl button -> reload index ----
        crawlBtn.addEventListener('click', async () => {
            crawlBtn.disabled = true;
            crawlBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Reloading…';
            await loadIndex();
            crawlBtn.disabled = false;
            crawlBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> Reload Index';
            if (currentQuery) performSearch(currentQuery);
        });

        // ---- Reset button -> clear ----
        resetBtn.addEventListener('click', () => {
            if (!confirm('Clear the loaded index?')) return;
            searchIndex = [];
            isIndexLoaded = false;
            resultCount.textContent = '🗑️ Index cleared. Click "Reload Index" to fetch.';
            showEmptyState();
            currentQuery = '';
            document.title = 'Vibe Search';
        });

        // ---- logo click ----
        logoLink.addEventListener('click', (e) => {
            e.preventDefault();
            input.value = '';
            clearBtn.classList.remove('visible');
            showEmptyState();
            currentQuery = '';
            resultCount.textContent = 'Ready to search';
            document.title = 'Vibe Search';
            input.focus();
        });

        // ---- about ----
        document.getElementById('aboutLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('🧠 Vibe Search (Static)\n\nClient-side TF‑IDF search.\nBuild index locally with the Python crawler,\nupload index.json to Cloudflare Pages.');
        });

        // ---- keyboard shortcuts ----
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                input.focus();
                input.select();
            }
            if (e.key === 'Escape') input.blur();
        });

        // ---- load index on startup ----
        loadIndex().then(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q');
            if (qParam) {
                input.value = qParam;
                clearBtn.classList.toggle('visible', true);
                performSearch(qParam);
            }
            input.focus();
        });

        window.__vibe = { performSearch, loadIndex, search };
    })();
</script>
</body>
</html>
