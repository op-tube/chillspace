<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChillSpace Search</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #f4f5fa;

    /* Animated rainbow: yellow → orange → purple → blue → green → yellow */
    background: linear-gradient(135deg,
      #ffe066 0%,
      #ff8c42 20%,
      #a855f7 40%,
      #3b82f6 60%,
      #22c55e 80%,
      #ffe066 100%);
    background-size: 400% 400%;
    animation: rainbowFlow 40s ease-in-out infinite;
    background-attachment: fixed;
  }

  @keyframes rainbowFlow {
    0%   { background-position:   0% 50%; }
    25%  { background-position:  50% 50%; }
    50%  { background-position: 100% 50%; }
    75%  { background-position:  50% 50%; }
    100% { background-position:   0% 50%; }
  }

  @media (prefers-reduced-motion: reduce) {
    html, body { animation: none; }
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 96px 24px 64px;
  }

  .brand {
    font-size: 14px; letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255,255,255,0.85);
    text-shadow: 0 1px 4px rgba(0,0,0,0.35);
    margin-bottom: 12px;
  }

  h1 {
    font-size: 44px; font-weight: 700; margin: 0 0 32px;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,0.35);
  }

  .searchbar {
    display: flex; align-items: center;
    background: rgba(10, 13, 22, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 14px;
    transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  }
  .searchbar:focus-within {
    border-color: rgba(255,255,255,0.5);
    background: rgba(10, 13, 22, 0.85);
    box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  }
  .searchbar input {
    flex: 1; background: transparent; border: 0; outline: 0;
    padding: 18px 20px; font-size: 17px; color: #fff;
  }
  .searchbar input::placeholder { color: rgba(255,255,255,0.5); }

  .status {
    font-size: 12px;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    padding: 10px 4px 0;
    min-height: 16px;
  }

  .results {
    margin-top: 20px;
    display: flex; flex-direction: column; gap: 8px;
  }

  .result {
    display: block;
    padding: 14px 16px;
    background: rgba(10, 13, 22, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 12px;
    text-decoration: none; color: #f4f5fa;
    transition: border-color 0.12s, transform 0.12s, background 0.12s;
  }
  .result:hover {
    border-color: rgba(255,255,255,0.45);
    background: rgba(10, 13, 22, 0.85);
    transform: translateY(-1px);
  }
  .result .title { font-size: 16px; font-weight: 600; }
  .result .desc {
    font-size: 13px; color: rgba(255,255,255,0.75);
    margin-top: 4px; line-height: 1.4;
  }
  .result .url {
    font-size: 12px; color: rgba(255,255,255,0.55);
    margin-top: 6px;
    word-break: break-all;
  }
  .result .badge {
    display: inline-block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1px 6px;
    margin-left: 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    vertical-align: middle;
  }

  .empty {
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    font-size: 14px; padding: 20px 4px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">ChillSpace</div>
    <h1>Search the world.</h1>
    <div class="searchbar">
      <input id="q" type="text" placeholder="Try &quot;quantum&quot;, &quot;tokyo&quot;, &quot;chillspace&quot;..." autocomplete="off" autofocus />
    </div>
    <div class="status" id="status"></div>
    <div class="results" id="results"></div>
  </div>

  <script>
    // ═════════════════════════════════════════════════════════════
    //  SOURCES
    //
    //  All files sit next to index.html, e.g.:
    //    https://chillspace.ai/search/chillspace-sitemap.json
    //
    //  Formats:
    //    titles.json             → array of ["Title"] or ["Title", "url"]
    //    everything else         → array of {title, url, description?}
    //
    //  tier: lower number = higher priority in results.
    //  Missing files are silently skipped.
    // ═════════════════════════════════════════════════════════════
    const SOURCES = [
      { name: "chillspace", file: "chillspace-sitemap.json", tier: 0, label: "ChillSpace" },
      { name: "web",        file: "web.json",                tier: 1, label: "Web"       },
      { name: "titles",     file: "titles.json",             tier: 2, label: "Wikipedia" },
      { name: "youtube",    file: "youtube.json",            tier: 3, label: "YouTube"   },
    ];

    // ═════════════════════════════════════════════════════════════
    //  URL DERIVATION (for titles.json entries with no explicit URL)
    // ═════════════════════════════════════════════════════════════
    const WIKI_BASE = "https://en.wikipedia.org/wiki/";

    function deriveWikiUrl(title) {
      return WIKI_BASE + encodeURIComponent(title.replace(/ /g, "_"))
        .replace(/%2C/g, ",")
        .replace(/%28/g, "(")
        .replace(/%29/g, ")")
        .replace(/%27/g, "'")
        .replace(/%21/g, "!")
        .replace(/%3A/g, ":");
    }

    // ═════════════════════════════════════════════════════════════
    //  LOADING
    // ═════════════════════════════════════════════════════════════
    async function loadSource(src) {
      let data;
      try {
        const res = await fetch(src.file, { cache: "no-cache" });
        if (!res.ok) return { src, docs: [], ok: false };
        data = await res.json();
      } catch (err) {
        // Network error, 404 body, malformed JSON — all skipped silently.
        return { src, docs: [], ok: false };
      }

      if (!Array.isArray(data)) return { src, docs: [], ok: false };

      const docs = [];
      for (let i = 0; i < data.length; i++) {
        const item = data[i];
        let title, url = null, description = null;

        if (Array.isArray(item)) {
          // Tuple form: ["Title"] or ["Title", "https://..."]
          title = item[0];
          url = item[1] || null;
        } else if (item && typeof item === "object" && typeof item.title === "string") {
          title = item.title;
          url = typeof item.url === "string" ? item.url : null;
          description = typeof item.description === "string" ? item.description : null;
        }

        if (typeof title !== "string" || title.length === 0) continue;

        // Fallback URL: Wikipedia derivation (used by titles.json).
        if (!url) url = deriveWikiUrl(title);

        docs.push({
          title,
          url,
          description,
          tier: src.tier,
          sourceName: src.name,
          sourceLabel: src.label,
        });
      }
      return { src, docs, ok: true };
    }

    // ═════════════════════════════════════════════════════════════
    //  INLINE SEARCH ENGINE
    //  - inverted index: token -> [docIds]
    //  - prefix matching via binary search on sorted vocab
    //  - fuzzy fallback via bounded Levenshtein (edit distance <= 1)
    //  - IDF weighting + title-position boosts
    //  - tier priority: chillspace > web > wikipedia > youtube
    // ═════════════════════════════════════════════════════════════
    const SearchEngine = (() => {
      const WORD_RE = /[a-z0-9]+/g;

      let N = 0;
      let docs = [];            // rich doc objects
      let lowerTitles = [];     // lowercase titles
      let postings = new Map(); // token -> array of doc ids
      let vocab = [];           // sorted unique tokens
      let buckets = new Map();  // first char -> tokens (for fuzzy scan)

      function lowerBound(arr, x) {
        let lo = 0, hi = arr.length;
        while (lo < hi) {
          const mid = (lo + hi) >>> 1;
          if (arr[mid] < x) lo = mid + 1; else hi = mid;
        }
        return lo;
      }

      function withinEdit(a, b, max) {
        const la = a.length, lb = b.length;
        if (Math.abs(la - lb) > max) return false;
        let prev = new Array(lb + 1);
        let cur = new Array(lb + 1);
        for (let j = 0; j <= lb; j++) prev[j] = j;
        for (let i = 1; i <= la; i++) {
          cur[0] = i;
          let rowMin = i;
          const ca = a.charCodeAt(i - 1);
          for (let j = 1; j <= lb; j++) {
            const cost = ca === b.charCodeAt(j - 1) ? 0 : 1;
            const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
            cur[j] = v;
            if (v < rowMin) rowMin = v;
          }
          if (rowMin > max) return false;
          const t = prev; prev = cur; cur = t;
        }
        return prev[lb] <= max;
      }

      function build(richDocs) {
        docs = richDocs;
        N = docs.length;
        lowerTitles = new Array(N);
        postings = new Map();

        for (let i = 0; i < N; i++) {
          const lower = docs[i].title.toLowerCase();
          lowerTitles[i] = lower;
          const toks = lower.match(WORD_RE) || [];
          const seen = new Set();
          for (let k = 0; k < toks.length; k++) {
            const tok = toks[k];
            if (seen.has(tok)) continue;
            seen.add(tok);
            let arr = postings.get(tok);
            if (arr === undefined) postings.set(tok, (arr = []));
            arr.push(i);
          }
        }

        vocab = Array.from(postings.keys()).sort();
        buckets = new Map();
        for (let i = 0; i < vocab.length; i++) {
          const t = vocab[i];
          const c = t[0];
          let b = buckets.get(c);
          if (b === undefined) buckets.set(c, (b = []));
          b.push(t);
        }
      }

      function prefixTokens(prefix, cap) {
        const out = [];
        const n = vocab.length;
        let i = lowerBound(vocab, prefix);
        while (i < n && out.length < cap) {
          const t = vocab[i];
          if (!t.startsWith(prefix)) break;
          out.push(t);
          i++;
        }
        return out;
      }

      function fuzzyTokens(word, cap) {
        const out = [];
        const bucket = buckets.get(word[0]);
        if (bucket === undefined) return out;
        const wl = word.length;
        for (let i = 0; i < bucket.length && out.length < cap; i++) {
          const t = bucket[i];
          if (t === word) continue;
          if (Math.abs(t.length - wl) > 1) continue;
          if (withinEdit(word, t, 1)) out.push(t);
        }
        return out;
      }

      function search(rawQuery, limit) {
        limit = limit || 40;
        const q = rawQuery.trim().toLowerCase();
        if (q === "" || N === 0) return [];

        const qTokens = q.match(WORD_RE);
        if (!qTokens || qTokens.length === 0) return [];

        const scores = new Map();
        let budget = 150000;

        for (let qi = 0; qi < qTokens.length; qi++) {
          const qt = qTokens[qi];

          let toks = prefixTokens(qt, 40);
          let quality = 0.85;

          if (toks.length === 0 && qt.length >= 4) {
            toks = fuzzyTokens(qt, 12);
            quality = 0.55;
          }

          for (let ti = 0; ti < toks.length; ti++) {
            const tok = toks[ti];
            const posting = postings.get(tok);
            const idf = Math.log(1 + N / posting.length);
            const w = idf * (tok === qt ? 1 : quality);

            for (let di = 0; di < posting.length; di++) {
              const d = posting[di];
              const prev = scores.get(d);
              scores.set(d, prev === undefined ? w : prev + w);
            }
            budget -= posting.length;
            if (budget <= 0) break;
          }
          if (budget <= 0) break;
        }

        const ranked = [];
        scores.forEach((s, d) => {
          const tl = lowerTitles[d];
          let bonus = 1;
          if (tl === q) bonus = 4;
          else if (tl.startsWith(q)) bonus = 2.5;
          else if (tl.indexOf(q) !== -1) bonus = 1.4;
          ranked.push({
            d,
            score: s * bonus,
            len: tl.length,
            tier: docs[d].tier,
          });
        });

        // Sort: tier first (priority), then score, then shorter title.
        ranked.sort((a, b) => {
          if (a.tier !== b.tier) return a.tier - b.tier;
          if (b.score !== a.score) return b.score - a.score;
          if (a.len !== b.len) return a.len - b.len;
          return docs[a.d].title < docs[b.d].title ? -1 : 1;
        });

        const results = [];
        const n = Math.min(limit, ranked.length);
        for (let i = 0; i < n; i++) {
          results.push(docs[ranked[i].d]);
        }
        return results;
      }

      return { build, search };
    })();

    // ═════════════════════════════════════════════════════════════
    //  UI
    // ═════════════════════════════════════════════════════════════
    const $q = document.getElementById("q");
    const $status = document.getElementById("status");
    const $results = document.getElementById("results");
    let ready = false;

    function displayUrl(url) {
      if (url.startsWith(WIKI_BASE)) {
        let slug = url.slice(WIKI_BASE.length);
        try { slug = decodeURIComponent(slug); } catch (e) {}
        return "en.wikipedia.org › " + slug.replace(/_/g, " ");
      }
      return url.replace(/^https?:\/\//, "");
    }

    function makeResult(r) {
      const a = document.createElement("a");
      a.className = "result";
      a.href = r.url;
      a.target = "_blank";
      a.rel = "noopener";

      const titleEl = document.createElement("div");
      titleEl.className = "title";
      titleEl.textContent = r.title;
      if (r.sourceLabel && r.tier !== 2) {
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.textContent = r.sourceLabel;
        titleEl.appendChild(badge);
      }
      a.appendChild(titleEl);

      if (r.description) {
        const descEl = document.createElement("div");
        descEl.className = "desc";
        descEl.textContent = r.description;
        a.appendChild(descEl);
      }

      const urlEl = document.createElement("div");
      urlEl.className = "url";
      urlEl.textContent = displayUrl(r.url);
      a.appendChild(urlEl);

      return a;
    }

    function render(results, query) {
      $results.textContent = "";

      if (query.trim() === "") {
        if (ready) {
          const n = SearchEngine ? ARTICLES_LENGTH : 0;
          $status.textContent = n.toLocaleString() + " items indexed";
        }
        return;
      }

      if (results.length === 0) {
        $status.textContent = "";
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = 'No matches for "' + query + '".';
        $results.appendChild(empty);
        return;
      }

      $status.textContent = results.length + (results.length === 1 ? " result" : " results");

      const frag = document.createDocumentFragment();
      for (let i = 0; i < results.length; i++) {
        frag.appendChild(makeResult(results[i]));
      }
      $results.appendChild(frag);
    }

    let ARTICLES_LENGTH = 0;

    let timer = null;
    $q.addEventListener("input", () => {
      if (!ready) return;
      clearTimeout(timer);
      const value = $q.value;
      timer = setTimeout(() => {
        render(SearchEngine.search(value), value);
      }, 40);
    });

    // ═════════════════════════════════════════════════════════════
    //  BOOT
    // ═════════════════════════════════════════════════════════════
    async function boot() {
      $status.textContent = "Loading sources…";

      const loaded = await Promise.all(SOURCES.map(loadSource));

      const allDocs = [];
      const report = [];
      for (let i = 0; i < loaded.length; i++) {
        const { src, docs, ok } = loaded[i];
        report.push(`${src.file}: ${ok ? docs.length : "missing"}`);
        for (let j = 0; j < docs.length; j++) allDocs.push(docs[j]);
      }

      ARTICLES_LENGTH = allDocs.length;
      console.log("[ChillSpace] " + report.join("  |  "));

      if (allDocs.length === 0) {
        $status.textContent = "No data sources available.";
        return;
      }

      const t0 = performance.now();
      SearchEngine.build(allDocs);
      const ms = Math.round(performance.now() - t0);
      ready = true;
      console.log("[ChillSpace] index built in " + ms + "ms, " + allDocs.length + " items");

      render([], "");
    }

    boot();
  </script>
</body>
</html>
