<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ReelSpace 릴스페이스</title>
    <meta name="description" content="ReelSpace — infinite story scroll. Discover heartwarming, funny, and unexpected tales about the people and things that connect us. Chillspace.ai/reelspace">
    <link rel="canonical" href="https://chillspace.ai/rs">

    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "ReelSpace",
            "alternateName": "릴스페이스",
            "description": "ReelSpace — infinite story scroll. Discover heartwarming, funny, and unexpected tales about the people and things that connect us.",
            "applicationCategory": "Entertainment",
            "operatingSystem": "All",
            "browserRequirements": "Requires JavaScript and modern browser",
            "url": "https://chillspace.ai/reelspace",
            "creator": {
                "@type": "Organization",
                "name": "Chillspace"
            },
            "offers": {
                "@type": "Offer",
                "price": "0",
                "priceCurrency": "USD"
            },
            "featureList": "Infinite story scroll, procedural gameplay background, background music, text-to-speech, like & bookmark stories, comment simulation"
        }
    </script>

    <style>
        :root {
            --bg: #000;
            --text: #fff;
            --accent: #ff2d55;
            --accent-tts: #00d4aa;
            --overlay: rgba(0, 0, 0, 0.55);
            --font-main: 'Segoe UI', 'Helvetica Neue', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden; background: #000;
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
            user-select: none; touch-action: pan-y;
        }
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none; display: block; background: #08080c;
        }
        #globalOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
            background: linear-gradient(0deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.35) 30%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.25) 75%, rgba(0,0,0,0.55) 100%);
        }
        #header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            padding: 14px 20px;
            padding-top: max(14px, env(safe-area-inset-top, 14px));
            display: flex; align-items: center; justify-content: space-between;
            pointer-events: none;
        }
        #header .logo {
            font-size: 1.4rem; font-weight: 800; letter-spacing: -0.02em; color: #fff;
            text-shadow: 0 1px 8px rgba(0,0,0,0.7);
            display: flex; align-items: baseline; gap: 8px; pointer-events: auto;
        }
        #header .logo .ko { font-size: 1rem; font-weight: 600; opacity: 0.85; }
        #header .badge {
            pointer-events: auto;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.25);
            color: #fff; padding: 7px 14px; border-radius: 24px;
            font-size: 0.8rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        #header .badge .lang-toggle {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            font-weight: 600; padding: 2px 10px; border-radius: 16px;
            font-size: 0.7rem; cursor: pointer; pointer-events: auto;
            font-family: var(--font-main);
        }
        #scrollContainer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow-y: scroll; scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch; z-index: 2; scroll-behavior: smooth;
        }
        #scrollContainer::-webkit-scrollbar { display: none; }
        .slide {
            width: 100%; height: 100vh; height: 100dvh;
            scroll-snap-align: start; scroll-snap-stop: always;
            position: relative; display: flex; flex-direction: column;
            justify-content: flex-end; padding: 20px;
            padding-bottom: calc(5px + var(--safe-bottom) + 70px); z-index: 2;
        }
        .story-card {
            position: relative; z-index: 3; max-width: 520px; width: 100%;
            margin: 0 auto 0 0; padding: 20px 22px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-radius: 18px; border: 1px solid rgba(255,255,255,0.12);
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
        }
        /* Hidden state: text + translucent background fully removed */
        .story-card.hidden { display: none !important; }

        .story-text {
            font-size: 1.05rem; line-height: 1.55; color: #fff; font-weight: 400;
            letter-spacing: 0.005em; text-shadow: 0 1px 4px rgba(0,0,0,0.5);
            word-break: break-word; max-height: 3.1em; overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .story-text.expanded { max-height: 1000px; }
        .story-text .highlight {
            color: #ffda6b; font-weight: 700;
            text-shadow: 0 0 12px rgba(255,218,107,0.4);
        }
        .story-buttons {
            display: flex; align-items: center; gap: 16px; margin-top: 8px;
        }
        .show-more-btn, .hide-btn {
            background: none; border: none; color: rgba(255,255,255,0.7);
            font-size: 0.8rem; cursor: pointer;
            text-decoration: underline; padding: 0; font-family: var(--font-main);
        }
        .show-more-btn:hover, .hide-btn:hover { color: #fff; }

        /* Small control that brings the story card back */
        .restore-story-btn {
            display: none;
            position: relative; z-index: 3;
            align-self: flex-start;
            padding: 9px 16px;
            border-radius: 20px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.14);
            color: #fff; font-size: 0.8rem; font-weight: 600;
            font-family: var(--font-main);
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.2s ease;
        }
        .restore-story-btn:active { transform: scale(0.94); }
        .slide.story-hidden .restore-story-btn { display: inline-flex; align-items: center; gap: 6px; }

        .side-actions {
            position: absolute; right: 14px; bottom: 110px;
            display: flex; flex-direction: column; align-items: center;
            gap: 18px; z-index: 5; pointer-events: auto;
        }
        .side-action {
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            cursor: pointer; background: none; border: none; color: #fff;
            font-family: var(--font-main); transition: transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .side-action:active { transform: scale(0.85); }
        .side-action .icon-circle {
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .side-action.liked .icon-circle {
            background: var(--accent); border-color: var(--accent);
            animation: heartPop 0.5s ease;
        }
        @keyframes heartPop {
            0% { transform: scale(1) }
            30% { transform: scale(1.35) }
            60% { transform: scale(0.9) }
            100% { transform: scale(1) }
        }
        .side-action .action-label {
            font-size: 0.7rem; font-weight: 500; letter-spacing: 0.03em;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
        }
        .heart-burst {
            position: fixed; pointer-events: none; z-index: 20;
            font-size: 2.5rem; animation: floatUp 1.1s ease-out forwards; opacity: 0;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.5) rotate(0deg); }
            50% { opacity: 0.9; transform: translateY(-50px) scale(1.2) rotate(10deg); }
            100% { opacity: 0; transform: translateY(-140px) scale(0.7) rotate(-15deg); }
        }
        #musicIndicator {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0);
            z-index: 15; pointer-events: none;
            background: rgba(0,0,0,0.75); color: #fff;
            padding: 10px 20px; border-radius: 24px;
            font-size: 0.85rem; font-weight: 600;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #musicIndicator.show { transform: translate(-50%, -50%) scale(1); }
        #startOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 30; background: #000;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 24px;
            transition: opacity 0.25s ease; pointer-events: all;
        }
        #startOverlay.hidden { opacity: 0; pointer-events: none; }
        #startOverlay.hidden-display { display: none !important; }
        .start-btn {
            padding: 16px 48px; font-size: 1.3rem; font-weight: 700;
            background: linear-gradient(135deg, #ff2d55, #ff6b6b);
            color: #fff; border: none; border-radius: 50px; cursor: pointer;
            letter-spacing: 0.02em; box-shadow: 0 8px 30px rgba(255,45,85,0.6);
            transition: transform 0.2s; font-family: var(--font-main);
        }
        .start-btn:active { transform: scale(0.95); }
        #commentOverlay {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(20,20,20,0.95);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            color: #fff; padding: 20px 20px calc(20px + var(--safe-bottom));
            z-index: 40; transform: translateY(100%);
            transition: transform 0.35s ease;
            max-height: 60vh; overflow-y: auto;
            border-radius: 20px 20px 0 0;
        }
        #commentOverlay.show { transform: translateY(0); }
        .comment {
            padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 0.9rem; line-height: 1.4;
        }
        .comment .user {
            font-weight: 700; color: #ffda6b; margin-right: 8px;
        }
        .close-comments {
            position: absolute; top: 10px; right: 16px;
            background: none; border: none; color: #fff;
            font-size: 1.5rem; cursor: pointer;
        }
        @media (max-width:480px) {
            .story-card { padding: 16px 18px; border-radius: 14px; max-width: 100%; }
            .story-text { font-size: 0.95rem; line-height: 1.5; max-height: 3.0em; }
            .side-actions { right: 8px; bottom: 120px; gap: 14px; }
            .side-action .icon-circle { width: 38px; height: 38px; font-size: 1.2rem; }
        }
    </style>
</head>
<body>
<canvas id="bgCanvas"></canvas>
<div id="globalOverlay"></div>
<div id="header">
    <div class="logo">ReelSpace<span class="ko">릴스페이스</span></div>
    <div class="badge">
        <span id="badgeText">📖 Infinite Stories</span>
        <button class="lang-toggle" id="langToggle">한국어</button>
    </div>
</div>
<div id="scrollContainer"></div>
<div id="musicIndicator">🎵 Music On</div>
<audio id="bgMusic" preload="auto" loop></audio>

<div id="startOverlay">
    <button class="start-btn" id="loadReelSpaceBtn">Load ReelSpace</button>
    <p id="startSub" style="color:rgba(255,255,255,0.6); font-size:0.9rem;">tap to start the experience</p>
</div>

<div id="commentOverlay">
    <button class="close-comments" id="closeCommentsBtn">&times;</button>
    <div id="commentList"></div>
</div>

<script>
    /* =====================================================================
       ChillSpace Procedural Gameplay Engine
       ===================================================================== */
    (function (global) {
    'use strict';

    let RND = Math.random;

    function mulberry32(a){
      return function(){
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand    = (a, b) => a + RND() * (b - a);
    const pick    = arr => arr[Math.floor(RND() * arr.length)];
    const clamp   = (v, a, b) => v < a ? a : (v > b ? b : v);
    const lerp    = (a, b, t) => a + (b - a) * t;

    function rr(ctx, x, y, w, h, r){
      r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y,     x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x,     y + h, r);
      ctx.arcTo(x,     y + h, x,     y,     r);
      ctx.arcTo(x,     y,     x + w, y,     r);
      ctx.closePath();
    }
    function fillRR(ctx, x, y, w, h, r, fill){
      if (w <= 0 || h <= 0) return;
      rr(ctx, x, y, w, h, r);
      ctx.fillStyle = fill;
      ctx.fill();
    }
    function fillCircle(ctx, x, y, r, fill){
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.28318);
      ctx.fillStyle = fill; ctx.fill();
    }
    function shade(hex, amt){
      const n = parseInt(hex.slice(1), 16);
      const r = clamp(Math.round(((n >> 16) & 255) + amt * 2.55), 0, 255);
      const g = clamp(Math.round(((n >> 8)  & 255) + amt * 2.55), 0, 255);
      const b = clamp(Math.round((n & 255)         + amt * 2.55), 0, 255);
      return 'rgb(' + r + ',' + g + ',' + b + ')';
    }

    /* ---- Sprite baking helper -----------------------------------------
       Characters are rendered ONCE into offscreen canvases and then drawn
       with drawImage(). Vector fills inside a rotating transform were being
       dropped on some GPUs while the character was moving; a bitmap blit
       cannot vanish. --------------------------------------------------- */
    const SPR_OVERSAMPLE = 2;
    function makeSprite(logicalSize, painter){
      const px = Math.max(1, Math.round(logicalSize * SPR_OVERSAMPLE));
      const c  = document.createElement('canvas');
      c.width  = px;
      c.height = px;
      const cx = c.getContext('2d');
      cx.scale(px / logicalSize, px / logicalSize);
      painter(cx, logicalSize);
      return c;
    }

    /* ================================================================ JUMP === */
    function makeJump(VW, VH){
      const G = 2800, JUMP_V = 1300, MAX_VX = 620, PW = 64, PH = 64;

      const SPR_LOGICAL = 160;
      const SPR_BODY_W  = 60;
      const SPR_BODY_H  = 60;

      function paintJump(c){
        const C = SPR_LOGICAL / 2;
        const w = SPR_BODY_W;
        const h = SPR_BODY_H;

        const bg = c.createLinearGradient(C, C - h / 2, C, C + h / 2);
        bg.addColorStop(0, '#fff3b0');
        bg.addColorStop(1, '#ffb347');
        c.fillStyle = bg;
        rr(c, C - w / 2, C - h / 2, w, h, h * 0.42);
        c.fill();

        const eyeOffX = w * 0.17;
        const eyeOffY = -h * 0.10;
        const eyeR    = w * 0.115;
        const shineR  = w * 0.065;
        const shineDY = -h * 0.025;

        c.fillStyle = '#2b1a2e';
        c.beginPath(); c.arc(C - eyeOffX, C + eyeOffY, eyeR, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(C + eyeOffX, C + eyeOffY, eyeR, 0, Math.PI * 2); c.fill();

        c.fillStyle = '#ffffff';
        c.beginPath(); c.arc(C - eyeOffX, C + eyeOffY + shineDY, shineR, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(C + eyeOffX, C + eyeOffY + shineDY, shineR, 0, Math.PI * 2); c.fill();

        c.beginPath();
        c.arc(C, C + h * 0.10, w * 0.13, 0.15 * Math.PI, 0.85 * Math.PI);
        c.lineWidth   = Math.max(2.5, w * 0.055);
        c.strokeStyle = '#2b1a2e';
        c.stroke();
      }

      const jumpSprite = makeSprite(SPR_LOGICAL, paintJump);

      let player, plats, genY, camY, t, d, wob, stars;
      let lastLandedPlat = null;
      let sameLandingCount = 0;

      function makeStars(){
        stars = [];
        const n = Math.round(70 * (VW * VH) / 700000);
        for (let i = 0; i < n; i++)
          stars.push({ x: rand(0, VW), y: rand(0, 2400), r: rand(0.7, 2.1), a: rand(.15, .7) });
      }

      function spawnUpTo(top){
        while (genY < top){
          const diff = clamp(genY / 14000, 0, 1);
          const prev = plats[plats.length - 1];
          const prevCenter = prev ? prev.x + prev.w * 0.5 : VW * 0.5;
          genY += lerp(100, 150, diff);
          const w = lerp(240, 150, diff) * rand(0.9, 1.1);
          const maxOffset = lerp(180, 120, diff);
          let cx = prevCenter + rand(-maxOffset, maxOffset);
          cx = clamp(cx, 20 + w / 2, VW - 20 - w / 2);
          plats.push({ x: cx - w / 2, w: w, y: genY });
        }
      }

      function reset(){
        player = { x: VW * 0.5, y: 0, vy: JUMP_V, vx: 0, sq: 0, tilt: 0 };
        plats  = [];
        const bw = Math.min(VW * 0.72, 340);
        plats.push({ x: VW * 0.5 - bw / 2, w: bw, y: 0 });
        genY = 0;
        camY = -VH * 0.42;
        t = 0; d = false; wob = rand(0, 10);
        lastLandedPlat = null;
        sameLandingCount = 0;
        spawnUpTo(camY + VH + 500);
        makeStars();
      }
      reset();

      function teleportUp(fromPlat){
        let nextP = null;
        for (let i = 0; i < plats.length; i++){
          const q = plats[i];
          if (q.y > fromPlat.y + 1 && (!nextP || q.y < nextP.y)) nextP = q;
        }
        if (!nextP){
          genY = fromPlat.y;
          spawnUpTo(fromPlat.y + lerp(100, 150, clamp(fromPlat.y / 14000, 0, 1)) + 40);
          for (let i = 0; i < plats.length; i++){
            const q = plats[i];
            if (q.y > fromPlat.y + 1 && (!nextP || q.y < nextP.y)) nextP = q;
          }
        }
        if (!nextP) return;
        player.x  = nextP.x + nextP.w * 0.5;
        player.y  = nextP.y;
        player.vy = JUMP_V;
        player.vx = 0;
        player.sq = 1;
        lastLandedPlat = nextP;
        sameLandingCount = 0;
      }

      function update(dt){
        t += dt;
        if (d){
          player.vy -= G * dt * 0.6;
          player.y  += player.vy * dt;
          player.tilt += dt * 4;
          return;
        }

        const MAX_REACH = 200;
        let target = null, best = Infinity;
        for (let i = 0; i < plats.length; i++){
          const p = plats[i];
          const dy = p.y - player.y;
          if (dy < 10 || dy > MAX_REACH) continue;
          let dx = (p.x + p.w * 0.5) - player.x;
          if (dx >  VW * 0.5) dx -= VW;
          if (dx < -VW * 0.5) dx += VW;
          const cost = Math.abs(dx) + dy * 1.5;
          if (cost < best){ best = cost; target = p; }
        }

        let tx = target ? target.x + target.w * 0.5 : VW * 0.5;
        tx += Math.sin(t * 2.1 + wob) * 10;

        let dx = tx - player.x;
        if (dx >  VW * 0.5) dx -= VW;
        if (dx < -VW * 0.5) dx += VW;

        const want = clamp(dx * 6 - player.vx * 0.5, -MAX_VX, MAX_VX);
        player.vx += (want - player.vx) * Math.min(1, dt * 13);
        player.x  += player.vx * dt;

        if (player.x < -PW)      player.x += VW + PW * 2;
        if (player.x > VW + PW)  player.x -= VW + PW * 2;

        const prevY = player.y;
        player.vy -= G * dt;
        player.y  += player.vy * dt;
        player.tilt = clamp(player.vx / MAX_VX, -1, 1) * 0.26;

        if (player.vy <= 0){
          for (let i = 0; i < plats.length; i++){
            const p = plats[i];
            if (player.x + PW * 0.28 > p.x && player.x - PW * 0.28 < p.x + p.w){
              if (prevY >= p.y && player.y <= p.y){
                player.y = p.y;
                player.vy = JUMP_V;
                player.sq = 1;

                if (p === lastLandedPlat){
                  sameLandingCount++;
                } else {
                  sameLandingCount = 1;
                  lastLandedPlat = p;
                }
                if (sameLandingCount > 3){
                  teleportUp(p);
                }
                break;
              }
            }
          }
        }
        player.sq = Math.max(0, player.sq - dt * 5.5);

        const camTarget = player.y - VH * 0.42;
        if (camTarget > camY) camY += (camTarget - camY) * Math.min(1, dt * 7);

        spawnUpTo(camY + VH + 500);
        if (plats.length > 120) plats = plats.filter(p => p.y > camY - 320);

        if (player.y < camY - 70) d = true;
      }

      function draw(ctx){
        const sky = ctx.createLinearGradient(0, 0, 0, VH);
        sky.addColorStop(0,    '#170f2e');
        sky.addColorStop(0.45, '#241a4a');
        sky.addColorStop(1,    '#0c0a1c');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VW, VH);

        const off = (camY * 0.13) % 2400;
        for (let i = 0; i < stars.length; i++){
          const s = stars[i];
          const y = ((s.y + off) % 2400 + 2400) % 2400 - 700;
          if (y < -30 || y > VH + 30) continue;
          ctx.globalAlpha = s.a;
          fillCircle(ctx, s.x, y, s.r, '#cfe4ff');
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < plats.length; i++){
          const p  = plats[i];
          const sy = VH - (p.y - camY);
          if (sy < -60 || sy > VH + 60) continue;
          const g = ctx.createLinearGradient(0, sy, 0, sy + 26);
          g.addColorStop(0, '#7ae9ff');
          g.addColorStop(1, '#2c74d0');
          fillRR(ctx, p.x, sy, p.w, 26, 12, g);
          ctx.globalAlpha = 0.5;
          fillRR(ctx, p.x + 7, sy + 3.5, p.w - 14, 6, 3, '#ffffff');
          ctx.globalAlpha = 1;
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        const py = VH - (player.y - camY);
        const sq = player.sq;
        const w  = PW * (1 - sq * 0.18);
        const h  = PH * (1 + sq * 0.22);

        const cx = Math.round(player.x);
        const cy = Math.round(py - h / 2);
        const angle = isFinite(player.tilt) ? player.tilt : 0;

        const spriteW = SPR_LOGICAL * w / SPR_BODY_W;
        const spriteH = SPR_LOGICAL * h / SPR_BODY_H;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(angle);
        ctx.drawImage(jumpSprite, -spriteW / 2, -spriteH / 2, spriteW, spriteH);
        ctx.restore();

        const vg = ctx.createRadialGradient(VW * 0.5, VH * 0.5, VH * 0.25, VW * 0.5, VH * 0.5, VH * 0.9);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,.55)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, VW, VH);
      }

      return { update: update, draw: draw, restart: reset, get dead(){ return d; } };
    }

    /* ============================================================== FLAPPY === */
    function makeFlappy(VW, VH){
      const G = 2300, FLAP = -720, PIPE_W = 96, R = 26;

      const SPR_LOGICAL = 160;
      const SPR_R       = 50;
      const spriteDraw  = SPR_LOGICAL * (R / SPR_R);

      function paintBird(wingAmount){
        return function(c){
          const C = SPR_LOGICAL / 2;
          const r = SPR_R;

          c.save();
          c.translate(C - r * 0.55, C + r * 0.05);
          c.rotate(-0.45 + (1 - wingAmount) * 0.85);
          const wg = c.createLinearGradient(-r * 0.6, -r * 0.22, -r * 0.6, r * 0.22);
          wg.addColorStop(0, '#ffe08a');
          wg.addColorStop(1, '#c9a230');
          c.fillStyle = wg;
          rr(c, -r * 1.00, -r * 0.22, r * 1.15, r * 0.44, r * 0.22);
          c.fill();
          c.restore();

          const bgr = c.createRadialGradient(C - r * 0.3, C - r * 0.35, r * 0.15, C, C, r * 1.15);
          bgr.addColorStop(0, '#fff3a8');
          bgr.addColorStop(1, '#f0a92c');
          c.fillStyle = bgr;
          c.beginPath(); c.arc(C, C, r, 0, Math.PI * 2); c.fill();

          c.fillStyle = 'rgba(255, 245, 200, 0.60)';
          c.beginPath(); c.arc(C - r * 0.08, C + r * 0.30, r * 0.45, 0, Math.PI * 2); c.fill();

          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(C + r * 0.35, C - r * 0.28, r * 0.35, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#1a1a1a';
          c.beginPath(); c.arc(C + r * 0.44, C - r * 0.28, r * 0.20, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#ffffff';
          c.beginPath(); c.arc(C + r * 0.50, C - r * 0.36, r * 0.10, 0, Math.PI * 2); c.fill();

          c.beginPath();
          c.moveTo(C + r * 0.75, C - r * 0.02);
          c.lineTo(C + r * 1.35, C + r * 0.14);
          c.lineTo(C + r * 0.75, C + r * 0.30);
          c.closePath();
          c.fillStyle = '#ff8b3d';
          c.fill();
        };
      }

      const spriteWingUp   = makeSprite(SPR_LOGICAL, paintBird(1));
      const spriteWingMid  = makeSprite(SPR_LOGICAL, paintBird(0.5));
      const spriteWingDown = makeSprite(SPR_LOGICAL, paintBird(0));

      let bird, pipes, t, d, groundY, score, nextX, flapped;
      let scrollFar, scrollMid, scrollGnd, clouds;

      function gapH(){ return Math.max(212, 330 - score * 4); }

      function addPipeAt(x){
        const gh  = gapH();
        const top = Math.max(VH * 0.10, 40);
        const lo  = top + gh / 2;
        const hi  = Math.max(lo, groundY - VH * 0.08 - gh / 2);
        pipes.push({ x: x, gapY: rand(lo, hi), gapH: gh, passed: false });
      }

      function reset(){
        groundY = VH - Math.max(90, VH * 0.12);
        bird = { x: VW * 0.30, y: VH * 0.42, vy: 0, rot: 0, wing: 0 };
        pipes = [];
        t = 0; d = false; score = 0; flapped = 0;
        nextX = VW + 400;
        scrollFar = 0; scrollMid = 0; scrollGnd = 0;
        clouds = [];
        for (let i = 0; i < 7; i++)
          clouds.push({ x: rand(0, VW + 400), y: rand(VH * 0.05, VH * 0.42), s: rand(0.6, 1.4) });
      }
      reset();

      function update(dt){
        t += dt;
        const speed = 300 + Math.min(170, score * 6);

        if (d){
          bird.vy += G * dt;
          bird.y  += bird.vy * dt;
          bird.rot = Math.min(1.45, bird.rot + dt * 4);
          return;
        }

        let target = null;
        for (let i = 0; i < pipes.length; i++){
          const p = pipes[i];
          if (p.x + PIPE_W > bird.x - 30 && (!target || p.x < target.x)) target = p;
        }
        let aimY = target ? target.gapY : VH * 0.45;
        aimY += Math.sin(t * 1.6) * 7;

        flapped -= dt;
        const predicted = bird.y + bird.vy * 0.02;
        if (predicted > aimY && flapped <= 0 && bird.vy > -420){
          bird.vy = FLAP;
          flapped = 0.085;
          bird.wing = 1;
        }
        bird.wing = Math.max(0, bird.wing - dt * 4);

        bird.vy += G * dt;
        if (bird.vy > 1300) bird.vy = 1300;
        bird.y += bird.vy * dt;

        const targetRot = clamp(bird.vy / 2400, -0.30, 0.45);
        bird.rot += (targetRot - bird.rot) * Math.min(1, dt * 12);

        if (bird.y - R < 0){ bird.y = R; if (bird.vy < 0) bird.vy = 0; }

        scrollFar -= speed * 0.12 * dt;
        scrollMid -= speed * 0.30 * dt;
        scrollGnd -= speed * dt;

        for (let i = 0; i < clouds.length; i++){
          const c = clouds[i];
          c.x -= speed * 0.16 * c.s * dt;
          if (c.x < -180){ c.x = VW + rand(40, 300); c.y = rand(VH * 0.05, VH * 0.42); }
        }

        for (let i = pipes.length - 1; i >= 0; i--){
          const p = pipes[i];
          p.x -= speed * dt;
          if (!p.passed && p.x + PIPE_W < bird.x - R){ p.passed = true; score++; }
          if (p.x + PIPE_W < -60) pipes.splice(i, 1);
        }
        nextX -= speed * dt;
        while (nextX < VW + 400){
          addPipeAt(nextX);
          nextX += Math.max(330, VW * 0.42);
        }

        if (bird.y + R > groundY){ bird.y = groundY - R; d = true; }
        for (let i = 0; i < pipes.length; i++){
          const p = pipes[i];
          if (bird.x + R * 0.8 > p.x && bird.x - R * 0.8 < p.x + PIPE_W){
            if (bird.y - R * 0.8 < p.gapY - p.gapH / 2 ||
                bird.y + R * 0.8 > p.gapY + p.gapH / 2){ d = true; break; }
          }
        }
      }

      function ridge(ctx, off, baseY, amp, freq, phase, color){
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, VH);
        for (let x = 0; x <= VW + 10; x += 10){
          const u = (x + off) * freq + phase;
          const y = baseY - (Math.sin(u) * 0.6 + Math.sin(u * 0.53 + 2.1) * 0.4) * amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(VW, VH);
        ctx.closePath();
        ctx.fill();
      }

      function draw(ctx){
        const sky = ctx.createLinearGradient(0, 0, 0, VH);
        sky.addColorStop(0,    '#1b2a5e');
        sky.addColorStop(0.45, '#3a5aa8');
        sky.addColorStop(0.78, '#e8845f');
        sky.addColorStop(1,    '#f2b57e');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VW, VH);

        const sunY = groundY - VH * 0.30;
        const sg = ctx.createRadialGradient(VW * 0.70, sunY, 4, VW * 0.70, sunY, VH * 0.30);
        sg.addColorStop(0,   'rgba(255,225,170,.95)');
        sg.addColorStop(0.25,'rgba(255,180,120,.42)');
        sg.addColorStop(1,   'rgba(255,140,90,0)');
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, VW, VH);

        ctx.globalAlpha = 0.55;
        for (let i = 0; i < clouds.length; i++){
          const c = clouds[i];
          const s = c.s * 26;
          fillCircle(ctx, c.x,           c.y,           s,        '#dce9ff');
          fillCircle(ctx, c.x + s * 1.1, c.y + s * 0.2, s * 0.78, '#dce9ff');
          fillCircle(ctx, c.x - s * 1.1, c.y + s * 0.25,s * 0.68, '#dce9ff');
        }
        ctx.globalAlpha = 1;

        ridge(ctx, scrollFar, groundY - VH * 0.11, VH * 0.045, 0.0042, 0.0, '#2b3560');
        ridge(ctx, scrollMid, groundY - VH * 0.04, VH * 0.030, 0.0090, 1.7, '#1f2848');

        for (let i = 0; i < pipes.length; i++){
          const p  = pipes[i];
          const topH = p.gapY - p.gapH / 2;
          const botY = p.gapY + p.gapH / 2;
          const botH = groundY - botY;

          const pg = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
          pg.addColorStop(0,   '#1f7a45');
          pg.addColorStop(0.35,'#4fd07f');
          pg.addColorStop(0.62,'#2ea862');
          pg.addColorStop(1,   '#14522f');

          fillRR(ctx, p.x, -10, PIPE_W, topH + 10, 6, pg);
          fillRR(ctx, p.x, botY, PIPE_W, botH + 10, 6, pg);
          fillRR(ctx, p.x - 8, topH - 30, PIPE_W + 16, 30, 6, pg);
          fillRR(ctx, p.x - 8, botY,      PIPE_W + 16, 30, 6, pg);
        }

        const gg = ctx.createLinearGradient(0, groundY, 0, VH);
        gg.addColorStop(0,   '#3b2c1c');
        gg.addColorStop(1,   '#1b140c');
        ctx.fillStyle = gg;
        ctx.fillRect(0, groundY, VW, VH - groundY);

        ctx.fillStyle = '#6fd18a';
        ctx.fillRect(0, groundY - 8, VW, 10);

        ctx.save();
        ctx.globalAlpha = 0.16;
        ctx.fillStyle = '#ffffff';
        const sw = 42;
        const so = ((scrollGnd % (sw * 2)) + sw * 2) % (sw * 2);
        for (let x = -so; x < VW; x += sw * 2) ctx.fillRect(x, groundY - 6, sw, 6);
        ctx.restore();

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        ctx.shadowColor = 'transparent';

        const bx = Math.round(bird.x);
        const by = Math.round(bird.y);
        const angle = isFinite(bird.rot) ? bird.rot : 0;

        const sprite = bird.wing > 0.66 ? spriteWingUp
                     : bird.wing > 0.33 ? spriteWingMid
                     :                    spriteWingDown;

        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(angle);
        ctx.drawImage(sprite, -spriteDraw / 2, -spriteDraw / 2, spriteDraw, spriteDraw);
        ctx.restore();
      }

      return { update: update, draw: draw, restart: reset, get dead(){ return d; } };
    }

    /* =============================================================== STACK === */
    function makeStack(VW, VH){
      const BH  = clamp(VH * 0.055, 46, 72);
      const PAL = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#c8a2ff','#ff9ff3','#54a0ff'];

      let tower, cur, camY, t, d, debris, flash, perfect, amp, stars;

      function makeStars(){
        stars = [];
        for (let i = 0; i < 60; i++)
          stars.push({ x: rand(0, VW), y: rand(0, VH), r: rand(0.6, 1.8), a: rand(.1, .5) });
      }

      function reset(){
        tower = [];
        const bw = Math.min(VW * 0.5, 300);
        tower.push({ x: -bw / 2, w: bw });
        camY = VH * 0.25;
        amp  = Math.min(VW * 0.38, 270);
        t = 0; d = false; debris = []; flash = 0; perfect = 0;
        spawnBlock();
        makeStars();
      }

      function spawnBlock(){
        const top  = tower[tower.length - 1];
        const dir  = RND() < 0.5 ? 1 : -1;
        const spd  = Math.min(760, 300 + tower.length * 11);
        cur = {
          x: -amp * dir,
          w: top.w,
          dir: dir,
          speed: spd,
          err: (RND() * 2 - 1) * 3.4,
          y: -tower.length * BH - BH * 1.9
        };
      }

      function drop(){
        const top = tower[tower.length - 1];
        const l   = Math.max(cur.x - cur.w * 0.5, top.x);
        const r   = Math.min(cur.x + cur.w * 0.5, top.x + top.w);
        const overlap = r - l;
        const y = cur.y;
        const col = PAL[tower.length % PAL.length];

        if (overlap < 8){
          d = true;
          debris.push({ x: cur.x - cur.w * 0.5, y: y, w: cur.w, h: BH,
                        vx: cur.dir * 90, vy: -180, rot: 0, vr: 2.4, c: col });
          return;
        }

        tower.push({ x: l, w: overlap });

        if (cur.x - cur.w * 0.5 < l){
          debris.push({ x: cur.x - cur.w * 0.5, y: y, w: l - (cur.x - cur.w * 0.5), h: BH,
                        vx: -80, vy: -140, rot: 0, vr: -2.2, c: col });
        }
        if (cur.x + cur.w * 0.5 > r){
          debris.push({ x: r, y: y, w: (cur.x + cur.w * 0.5) - r, h: BH,
                        vx: 80, vy: -140, rot: 0, vr: 2.2, c: col });
        }

        if (overlap > cur.w - 4) perfect = 1;
        flash = 0.4;
        spawnBlock();
      }

      reset();

      function update(dt){
        t += dt;
        flash   = Math.max(0, flash - dt * 2.5);
        perfect = Math.max(0, perfect - dt * 2);

        for (let i = debris.length - 1; i >= 0; i--){
          const db = debris[i];
          db.vy  += 2600 * dt;
          db.y   += db.vy * dt;
          db.x   += db.vx * dt;
          db.rot += db.vr * dt;
          if (db.y - camY > VH + 400) debris.splice(i, 1);
        }

        const camTarget = VH * 0.25 - (tower.length - 1) * BH;
        camY += (camTarget - camY) * Math.min(1, dt * 4.5);

        if (d) return;

        const top  = tower[tower.length - 1];
        const topC = top.x + top.w * 0.5;
        const aim  = clamp(topC + cur.err, -amp, amp);

        const nx = cur.x + cur.dir * cur.speed * dt;
        const crossed = cur.dir > 0
          ? (cur.x <= aim && nx >= aim)
          : (cur.x >= aim && nx <= aim);

        if (crossed){
          cur.x = aim;
          drop();
        } else {
          cur.x = nx;
          if (cur.x >  amp){ cur.x =  amp; cur.dir = -1; }
          if (cur.x < -amp){ cur.x = -amp; cur.dir =  1; }
        }
      }

      function drawBlock(ctx, x, y, w, h, c, alpha){
        if (w <= 0.5) return;
        ctx.globalAlpha = alpha;
        const g = ctx.createLinearGradient(x, y, x, y + h);
        g.addColorStop(0, shade(c,  20));
        g.addColorStop(1, shade(c, -16));
        fillRR(ctx, x, y, w, h, 6, g);
        ctx.globalAlpha = alpha * 0.28;
        fillRR(ctx, x + 3, y + 3, Math.max(0, w - 6), h * 0.20, 4, '#ffffff');
        ctx.globalAlpha = 1;
      }

      function draw(ctx){
        const H0 = VH * 0.75;
        const sy = wy => H0 + (wy - camY);

        const hue = 212 + tower.length * 1.15;
        const sky = ctx.createLinearGradient(0, 0, 0, VH);
        sky.addColorStop(0,   'hsl(' + ((hue)      % 360) + ',48%,11%)');
        sky.addColorStop(0.55,'hsl(' + ((hue + 28) % 360) + ',44%,19%)');
        sky.addColorStop(1,   'hsl(' + ((hue + 62) % 360) + ',38%,26%)');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VW, VH);

        for (let i = 0; i < stars.length; i++){
          const s = stars[i];
          const y = ((s.y - camY * 0.25) % VH + VH) % VH;
          ctx.globalAlpha = s.a;
          fillCircle(ctx, s.x, y, s.r, '#dbe9ff');
        }
        ctx.globalAlpha = 1;

        const cx = VW * 0.5;

        for (let i = 0; i < tower.length; i++){
          const b = tower[i];
          const y = sy(-i * BH);
          if (y > VH + BH * 2) continue;
          if (y < -BH * 4) break;
          drawBlock(ctx, cx + b.x, y, b.w, BH, PAL[i % PAL.length], 1);
        }

        if (!d){
          const y = sy(cur.y);
          ctx.save();
          ctx.shadowColor = 'rgba(255,255,255,.35)';
          ctx.shadowBlur  = 24;
          drawBlock(ctx, cx + cur.x - cur.w * 0.5, y, cur.w, BH, PAL[tower.length % PAL.length], 1);
          ctx.restore();
        }

        for (let i = 0; i < debris.length; i++){
          const db = debris[i];
          ctx.save();
          ctx.translate(cx + db.x + db.w * 0.5, sy(db.y) + BH * 0.5);
          ctx.rotate(db.rot);
          ctx.globalAlpha = 0.9;
          drawBlock(ctx, -db.w * 0.5, -BH * 0.5, db.w, BH, db.c, 1);
          ctx.restore();
        }
        ctx.globalAlpha = 1;

        if (perfect > 0){
          ctx.globalAlpha = perfect * 0.18;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, VW, VH);
          ctx.globalAlpha = 1;
        }
        if (flash > 0){
          ctx.globalAlpha = flash * 0.10;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, VW, VH);
          ctx.globalAlpha = 1;
        }

        const vg = ctx.createRadialGradient(VW * 0.5, VH * 0.5, VH * 0.22, VW * 0.5, VH * 0.5, VH * 0.95);
        vg.addColorStop(0, 'rgba(0,0,0,0)');
        vg.addColorStop(1, 'rgba(0,0,0,.55)');
        ctx.fillStyle = vg;
        ctx.fillRect(0, 0, VW, VH);
      }

      return { update: update, draw: draw, restart: reset, get dead(){ return d; } };
    }

    /* ============================================================== RUNNER === */
    function makeRunner(VW, VH){
      const G = 3400, JUMP = -1180;

      let player, obs, speed, dist, t, d, spawnIn, clouds, groundY;

      function reset(){
        groundY = VH - Math.max(110, VH * 0.16);
        player  = { x: VW * 0.26, y: groundY, vy: 0, onGround: true, phase: 0, squash: 0 };
        obs = [];
        speed = 380;
        dist  = 0;
        t = 0; d = false;
        spawnIn = VW * 0.9;
        clouds = [];
        for (let i = 0; i < 9; i++)
          clouds.push({ x: rand(0, VW), y: rand(VH * 0.06, VH * 0.36), s: rand(0.5, 1.2), sp: rand(0.05, 0.14) });
      }
      reset();

      function update(dt){
        t += dt;

        if (d){
          player.vy += G * dt;
          player.y  += player.vy * dt;
          for (let i = 0; i < obs.length; i++) obs[i].x -= speed * dt;
          return;
        }

        speed = 380 + Math.min(340, dist * 0.012);
        dist += speed * dt;

        let next = null;
        for (let i = 0; i < obs.length; i++){
          const o = obs[i];
          if (o.x + o.w > player.x + 24 && (!next || o.x < next.x)) next = o;
        }
        if (next && player.onGround){
          const airT     = 2 * Math.abs(JUMP) / G;
          const peakDist = speed * airT * 0.5;
          const target   = next.x + next.w * 0.5 - player.x;
          if (target < peakDist + 14 && target > -next.w){
            player.vy = JUMP;
            player.onGround = false;
            player.squash = 1;
          }
        }

        player.vy += G * dt;
        player.y  += player.vy * dt;
        if (player.y >= groundY){
          player.y = groundY;
          player.vy = 0;
          player.onGround = true;
        }
        player.squash = Math.max(0, player.squash - dt * 4);
        if (player.onGround) player.phase += speed * dt * 0.035;

        spawnIn -= speed * dt;
        if (spawnIn <= 0){
          const w = rand(48, 86);
          const h = rand(58, 118);
          obs.push({ x: VW + w + 20, w: w, h: h,
                     c: pick(['#ff6b6b','#feca57','#48dbfb','#c8a2ff']) });
          spawnIn = speed * rand(1.05, 1.75);
        }

        const PH = 74, PW = 34;
        for (let i = obs.length - 1; i >= 0; i--){
          const o = obs[i];
          o.x -= speed * dt;
          if (o.x + o.w < -60){ obs.splice(i, 1); continue; }
          if (player.x + PW * 0.5 > o.x && player.x - PW * 0.5 < o.x + o.w){
            if (player.y > groundY - o.h + 6) d = true;
          }
        }

        for (let i = 0; i < clouds.length; i++){
          const c = clouds[i];
          c.x -= speed * c.sp * dt;
          if (c.x < -220){ c.x = VW + rand(40, 320); c.y = rand(VH * 0.06, VH * 0.36); }
        }
      }

      function ridge(ctx, off, baseY, amp, freq, phase, color){
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(0, VH);
        for (let x = 0; x <= VW + 10; x += 10){
          const u = (x + off) * freq + phase;
          const y = baseY - (Math.sin(u) * 0.6 + Math.sin(u * 0.53 + 2.1) * 0.4) * amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(VW, VH);
        ctx.closePath();
        ctx.fill();
      }

      function draw(ctx){
        const sky = ctx.createLinearGradient(0, 0, 0, VH);
        sky.addColorStop(0,    '#101833');
        sky.addColorStop(0.42, '#2a3d78');
        sky.addColorStop(0.72, '#a45f8a');
        sky.addColorStop(1,    '#f0a06a');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, VW, VH);

        const sunY = groundY - VH * 0.34;
        const sg = ctx.createRadialGradient(VW * 0.74, sunY, 4, VW * 0.74, sunY, VH * 0.34);
        sg.addColorStop(0,   'rgba(255,235,190,.95)');
        sg.addColorStop(0.2, 'rgba(255,190,130,.40)');
        sg.addColorStop(1,   'rgba(255,150,100,0)');
        ctx.fillStyle = sg;

    function create(canvas, opts){
      opts = opts || {};
      const ctx  = canvas.getContext('2d', { alpha: false });
      const fps  = clamp(opts.fps || 60, 20, 60);
      const STEP = 1 / fps;

      // How long a finished game stays on screen before auto-restarting
      const RESTART_DELAY = 0.9;

      let VW = 1000, VH = 1000, scale = 1, aspect = 1;
      let scene = null, sceneName = '';
      let raf = 0, last = 0, acc = 0, running = false;
      let deadTimer = 0;

      if (opts.seed != null) RND = mulberry32(opts.seed);

      function setSceneNow(name){
        if (!SCENES[name]) return;
        sceneName = name;
        scene = SCENES[name](VW, VH);
        deadTimer = 0;
      }

      function measure(){
        const r = canvas.getBoundingClientRect();
        let w = r.width  || canvas.clientWidth  || global.innerWidth  || 1;
        let h = r.height || canvas.clientHeight || global.innerHeight || 1;
        return { w: Math.max(1, w), h: Math.max(1, h) };
      }

      function applySize(){
        const m  = measure();
        const dpr = Math.min(global.devicePixelRatio || 1, 2);
        canvas.width  = Math.round(m.w * dpr);
        canvas.height = Math.round(m.h * dpr);

        if (m.w >= m.h){ VH = 1000; VW = 1000 * (m.w / m.h); }
        else           { VW = 1000; VH = 1000 * (m.h / m.w); }

        scale = canvas.width / VW;
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        ctx.imageSmoothingEnabled = true;

        return m.w / m.h;
      }

      let resizeTimer = 0;
      function onResize(){
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function(){
          const a = applySize();
          if (Math.abs(a - aspect) > 0.02){
            aspect = a;
            if (sceneName) setSceneNow(sceneName);
          }
          render();
        }, 120);
      }

      function update(dt){
        if (!scene) return;

        scene.update(dt);

        // ── Auto-restart the SAME game once it has ended ──────────────
        if (scene.dead){
          deadTimer += dt;
          if (deadTimer >= RESTART_DELAY){
            deadTimer = 0;
            if (typeof scene.restart === 'function') scene.restart();
            else setSceneNow(sceneName);
          }
        } else {
          deadTimer = 0;
        }
      }

      function render(){
        ctx.setTransform(scale, 0, 0, scale, 0, 0);
        if (scene) scene.draw(ctx);
        else { ctx.fillStyle = '#08080c'; ctx.fillRect(0, 0, VW, VH); }
      }

      function tick(now){
        raf = requestAnimationFrame(tick);
        if (!last) last = now;
        let dt = (now - last) / 1000;
        last = now;
        if (dt > 0.2) dt = 0.2;

        acc += dt;
        let guard = 0;
        while (acc >= STEP && guard++ < 5){
          update(STEP);
          acc -= STEP;
        }
        render();
      }

      function start(){
        if (running) return;
        running = true;

        aspect = applySize();
        if (!sceneName) setSceneNow('jump');

        last = 0; acc = 0; deadTimer = 0;
        raf = requestAnimationFrame(tick);

        global.addEventListener('resize', onResize);
        global.addEventListener('orientationchange', onResize);
        document.addEventListener('visibilitychange', onVisibility);
      }

      function stop(){
        running = false;
        cancelAnimationFrame(raf); raf = 0;
        global.removeEventListener('resize', onResize);
        global.removeEventListener('orientationchange', onResize);
        document.removeEventListener('visibilitychange', onVisibility);
      }

      function onVisibility(){
        if (document.hidden){
          cancelAnimationFrame(raf); raf = 0;
        } else if (running && !raf){
          last = 0; acc = 0;
          raf = requestAnimationFrame(tick);
        }
      }

      return {
        start: start,
        stop: stop,
        setScene: setSceneNow,
        get scene(){ return sceneName; }
      };
    }

        function replaceWordsInText(text) {
            if (!text) return text;
            const regex = new RegExp('\\b(' + safeSwapWords.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')\\b', 'gi');
            return text.replace(regex, function(match) {
                const lower = match.toLowerCase();
                const synonyms = filteredDict[lower];
                if (!synonyms) return match;
                const chosen = synonyms[Math.floor(Math.random() * synonyms.length)];
                if (match === match.toUpperCase()) return chosen.toUpperCase();
                if (match[0] === match[0].toUpperCase()) return chosen.charAt(0).toUpperCase() + chosen.slice(1);
                return chosen;
            });
        }

            while (node = walker.nextNode()) {
                node.textContent = replaceWordsInText(node.textContent);
            }

            "소셜 미디어가 OP를 조여왔지만, <span class=\"highlight\">${rel}</span>이 구명줄—ChillSpace를 제공했다. OP는 ReelSpace와 그 무작위적이고 아름다운 이야기들의 모음을 발견했다. 가변적 보상에서 일관되고 건강한 콘텐츠로의 전환은 신선한 공기 같은 것이었다. OP는 마침내 통제력을 되찾았다.",
            "OP는 온라인의 소음과 부정성에 지쳤다. <span class=\"highlight\">${rel}</span>이 평화로운 안식처인 ChillSpace에 대해 알려줬다. ReelSpace는 OP의 새로운 일상이 되었다—연결감을 주는 이야기 읽기. 좋은 이야기의 일관된 보상은 소셜 미디어의 혼돈을 대체했고, OP는 평온을 찾았다.",
            "알고리즘은 OP를 어떻게 붙잡을지 알았지만, <span class=\"highlight\">${rel}</span>이 더 잘 알았다. 그들은 ChillSpace와 ReelSpace를 공유했고, 유일한 알고리즘은 스토리텔링에 대한 사랑이었다. OP는 가변적 보상을 잘 전달된 이야기의 꾸준한 기쁨으로 교환했고, 그들의 삶은 더 나아졌다.",
            "OP의 친구들은 그들의 소셜 미디어 집착을 걱정했다. <span class=\"highlight\">${rel}</span>이 다른 종류의 피드를 제공하는 ChillSpace를 소개했다—이야기 기반, 지위가 아닌. ReelSpace의 끝없는 이야기 스크롤은 OP의 새로운 습관이 되었고, 일관된 보상은 자유를 찾는 데 도움이 됐다.",
            "OP는 소셜 미디어가 얼마나 영향을 미치는지 깨닫지 못했다가 <span class=\"highlight\">${rel}</span>이 지적할 때까지였다. 그들은 진정한 콘텐츠를 우선시하는 ChillSpace와 ReelSpace를 제안했다. OP는 전환했고, 좋은 이야기의 일관된 보상이 모든 차이를 만들었다.",
            "알림을 확인하려는 충동은 압도적이었지만, <span class=\"highlight\">${rel}</span>이 OP에게 새로운 도구—ChillSpace를 줬다. ReelSpace의 이야기는 OP의 새로운 즐거움이 되었고, 불안을 남기지 않았다. 가변적에서 일관된 보상으로의 전환은 중독 극복의 열쇠였다.",
            "OP의 <span class=\"highlight\">${rel}</span>은 이성의 목소리였고, ChillSpace를 시도하라고 권했다. ReelSpace의 끝없는 따뜻하고 재미있는 이야기들은 OP의 마음을 사로잡았다. 좋은 이야기의 일관된 보상은 좋아요의 일시적인 고열을 대체했고, OP의 행복은 치솟았다.",
            "OP는 연결을 유지하기 위해 소셜 미디어가 필요하다고 생각했지만, <span class=\"highlight\">${rel}</span>이 ChillSpace를 보여줬고, 그곳에서 연결은 지위가 아닌 이야기에서 온다. ReelSpace의 일상 이야기는 OP에게 진정으로 중요한 것을 상기시켰다. 좋은 이야기의 일관된 보상은 인정의 필요를 대체했고, OP는 해방감을 느꼈다.",
            "마지막 결정타는 <span class=\"highlight\">${rel}</span>이 스크롤 후 OP가 얼마나 스트레스받아 보이는지 지적했을 때였다. 그들은 실험으로 ChillSpace와 ReelSpace를 제안했다. OP는 시도했고, 매력적인 이야기의 일관된 보상은 빠르게 생명줄이 되었다. 이제 OP는 혼돈으로 돌아가는 것을 상상할 수 없다."
        ];

        function getTopics() { return currentLang === 'ko' ? koTopics : enTopics; }
        function getRelations() { return currentLang === 'ko' ? koRelations : enRelations; }
        function getTemplates() { return currentLang === 'ko' ? koTemplates : enTemplates; }

        // ─── STORY GENERATION ──────────────────────
        let allStories = [];

        function generateStories(count) {
            const topics = getTopics();
            const relations = getRelations();
            const templates = getTemplates();
            const stories = [];
            const usedCombos = new Set();
            while (stories.length < count) {
                const tpl = templates[Math.floor(Math.random() * templates.length)];
                const topic = topics[Math.floor(Math.random() * topics.length)];
                const rel = relations[Math.floor(Math.random() * relations.length)];
                const key = `${tpl}|||${topic}|||${rel}`;
                if (!usedCombos.has(key)) {
                    usedCombos.add(key);
                    let htmlText = tpl.replace(/\$\{topic\}/g, topic).replace(/\$\{rel\}/g, rel);
                    let plainText = htmlText.replace(/<[^>]*>/g, '');
                    if (currentLang === 'en') {
                        htmlText = replaceWordsInHtml(htmlText);
                        plainText = replaceWordsInText(plainText);
                    }
                    stories.push({ topic, rel, htmlText, plainText, id: stories.length + 1 });
                }
            }
            for (let i = stories.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [stories[i], stories[j]] = [stories[j], stories[i]];
            }
            stories.forEach((s, idx) => { s.id = idx + 1; });
            return stories;
        }

        function rebuildStories() {
            allStories = generateStories(130);
        }

        // ─── BUILD SLIDES ─────────────────────────
        function buildSlides() {
            scrollContainer.innerHTML = '';
            const fragment = document.createDocumentFragment();
            allStories.forEach((story, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                slide.dataset.storyId = story.id;
                slide.dataset.index = index;
                const likeCount = Math.floor(Math.random() * 95000) + 1200;
                const commentCount = Math.floor(Math.random() * 8000) + 80;
                const shareCount = Math.floor(Math.random() * 15000) + 200;
                slide.innerHTML = `
                            <div class="story-card">
                                <div class="story-text">${story.htmlText}</div>
                                <div class="story-buttons">
                                    <button class="show-more-btn">${currentLang === 'ko' ? '더 보기' : 'Show more'}</button>
                                    <button class="hide-btn">${currentLang === 'ko' ? '숨기기' : 'Hide'}</button>
                                </div>
                            </div>
                            <button class="restore-story-btn">👁 ${currentLang === 'ko' ? '이야기 보기' : 'Show story'}</button>
                            <div class="side-actions">
                                <button class="side-action like-btn" data-index="${index}"><span class="icon-circle">❤️</span><span class="action-label like-count">${formatCount(likeCount)}</span></button>
                                <button class="side-action comment-btn" data-index="${index}"><span class="icon-circle">💬</span><span class="action-label">${formatCount(commentCount)}</span></button>
                                <button class="side-action"><span class="icon-circle">↗️</span><span class="action-label">${formatCount(shareCount)}</span></button>
                                <button class="side-action bookmark-btn" data-index="${index}"><span class="icon-circle">🔖</span><span class="action-label">${currentLang === 'ko' ? '저장' : 'Save'}</span></button>
                            </div>
                        `;
                fragment.appendChild(slide);
            });
            scrollContainer.appendChild(fragment);
            setupIntersectionObserver();
            activeIndex = 0;
            scrollContainer.scrollTop = 0;
        }

        function formatCount(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        // ─── COMMENTS ──────────────────────────────
        function generateComments(topic, rel) {
            const templates = [
                `<span class="user">user_${Math.floor(Math.random()*9999)}</span> ${rel} was definitely the bad guy`,
                `<span class="user">anon_${Math.floor(Math.random()*999)}</span> Thanks for reminding me how much I love ${topic}`,
                `<span class="user">storylover</span> I can't believe ${rel} said that about ${topic}`,
                `<span class="user">reddit_refugee</span> This is exactly why ${topic} matters so much`,
                `<span class="user">just_lurking</span> ${rel} and ${topic} – name a more iconic duo`,
                `<span class="user">deep_thinker</span> The way ${rel} talked about ${topic} changed my perspective`,
                `<span class="user">random_user</span> I need more stories about ${topic} and ${rel}`
            ];
            const comments = [];
            for (let i = 0; i < 5; i++) {
                comments.push(templates[Math.floor(Math.random() * templates.length)]);
            }
            return comments;
        }

        function showComments(index) {
            const story = allStories[index];
            if (!story) return;
            const comments = generateComments(story.topic, story.rel);
            commentList.innerHTML = comments.map(c => `<div class="comment">${c}</div>`).join('');
            commentOverlay.classList.add('show');
        }

        // ─── INTERSECTION OBSERVER ──────────────────
        let observer = null;
        let activeIndex = 0;

        function setupIntersectionObserver() {
            if (observer) observer.disconnect();
            observer = new IntersectionObserver((entries) => {
                let maxRatio = 0, mostVisible = activeIndex;
                entries.forEach(e => {
                    if (e.isIntersecting && e.intersectionRatio > maxRatio) {
                        maxRatio = e.intersectionRatio;
                        const idx = parseInt(e.target.dataset.index);
                        if (!isNaN(idx)) mostVisible = idx;
                    }
                });
                if (mostVisible !== activeIndex && maxRatio > 0.5) {
                    const prev = activeIndex;
                    activeIndex = mostVisible;
                    onSlideChange(prev, activeIndex);
                }
            }, { root: scrollContainer, threshold: [0.3, 0.5, 0.6, 0.7, 0.8, 0.9] });
            document.querySelectorAll('.slide').forEach(s => observer.observe(s));
        }

        // ─── SLIDE CHANGE ──────────────────────────
        let currentTTSIndex = -1;
        let autoTTSTimeout = null;
        let isProcessingSlide = false;

        function onSlideChange(prev, curr) {
            if (isProcessingSlide) return;
            isProcessingSlide = true;

            stopTTS();

            bg.setScene(pickRandomGame());

            playRandomMusic().then(() => {
                bgMusic.loop = true;
                isProcessingSlide = false;
            }).catch(() => {
                isProcessingSlide = false;
            });

            showMusicIndicator();
            if (audioInitialized) {
                if (autoTTSTimeout) clearTimeout(autoTTSTimeout);
                autoTTSTimeout = setTimeout(() => {
                    if (activeIndex === curr && currentTTSIndex === -1) speakStory(curr);
                }, 400);
            }
        }

        function showMusicIndicator() {
            musicIndicator.classList.add('show');
            clearTimeout(musicIndicator._timeout);
            musicIndicator._timeout = setTimeout(() => musicIndicator.classList.remove('show'), 1500);
        }

        function stopTTS() {
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            currentTTSIndex = -1;
        }

        function speakStory(index) {
            if (!audioInitialized) return;
            const story = allStories[index];
            if (!story) return;
            if (currentTTSIndex === index && (window.speechSynthesis?.speaking)) {
                stopTTS();
                return;
            }
            stopTTS();
            speakText(story.plainText, currentLang);
            currentTTSIndex = index;
        }

        // ─── AUDIO INIT ────────────────────────────
        let audioInitialized = false;

        function startAudioAndTTS() {
            if (audioInitialized) return;
            audioInitialized = true;
            playRandomMusic().then(() => { bgMusic.loop = true; }).catch(() => {});
            speakStory(activeIndex);
        }

        // ─── LIKE / BOOKMARK ──────────────────────
        const likedStories = new Set();
        const bookmarkedStories = new Set();

        function toggleLike(index, btn) {
            const key = `story-${index}`;
            const label = btn.querySelector('.like-count');
            if (likedStories.has(key)) {
                likedStories.delete(key);
                btn.classList.remove('liked');
                label.textContent = formatCount(Math.max(0, parseCount(label.textContent) - 1));
            } else {
                likedStories.add(key);
                btn.classList.add('liked');
                label.textContent = formatCount(parseCount(label.textContent) + 1);
                spawnHeartBurst(btn);
            }
        }

        function parseCount(s) { if (s.endsWith('M')) return parseFloat(s) * 1000000; if (s.endsWith('K')) return parseFloat(s) * 1000; return parseInt(s) || 0; }

        function spawnHeartBurst(el) {
            const rect = el.getBoundingClientRect();
            const heart = document.createElement('div');
            heart.className = 'heart-burst';
            heart.textContent = '❤️';
            heart.style.left = rect.left + rect.width / 2 - 20 + 'px';
            heart.style.top = rect.top + 'px';
            document.body.appendChild(heart);
            heart.addEventListener('animationend', () => heart.remove());
        }

        function toggleBookmark(index, btn) {
            const key = `story-${index}`;
            const icon = btn.querySelector('.icon-circle');
            if (bookmarkedStories.has(key)) { bookmarkedStories.delete(key); icon.textContent = '🔖'; }
            else { bookmarkedStories.add(key); icon.textContent = '📌'; }
        }

        // ─── EVENTS ──────────────────────────────────
        function setupEvents() {
            scrollContainer.addEventListener('click', (e) => {
                const likeBtn = e.target.closest('.like-btn');
                if (likeBtn) { e.preventDefault();
                    const idx = parseInt(likeBtn.dataset.index); if (!isNaN(idx)) toggleLike(idx, likeBtn); return; }
                const bookmarkBtn = e.target.closest('.bookmark-btn');
                if (bookmarkBtn) { e.preventDefault();
                    const idx = parseInt(bookmarkBtn.dataset.index); if (!isNaN(idx)) toggleBookmark(idx, bookmarkBtn); return; }
                const commentBtn = e.target.closest('.comment-btn');
                if (commentBtn) { e.preventDefault();
                    const idx = parseInt(commentBtn.dataset.index); if (!isNaN(idx)) showComments(idx); return; }

                // ── Hide the whole story card (text + background) ──
                const hideBtn = e.target.closest('.hide-btn');
                if (hideBtn) {
                    e.preventDefault();
                    const slide = hideBtn.closest('.slide');
                    if (slide) {
                        const card = slide.querySelector('.story-card');
                        if (card) card.classList.add('hidden');
                        slide.classList.add('story-hidden');
                    }
                    return;
                }

                // ── Bring the story card back ──
                const restoreBtn = e.target.closest('.restore-story-btn');
                if (restoreBtn) {
                    e.preventDefault();
                    const slide = restoreBtn.closest('.slide');
                    if (slide) {
                        const card = slide.querySelector('.story-card');
                        if (card) card.classList.remove('hidden');
                        slide.classList.remove('story-hidden');
                    }
                    return;
                }

                const showMoreBtn = e.target.closest('.show-more-btn');
                if (showMoreBtn) {
                    const storyText = showMoreBtn.parentElement.parentElement.querySelector('.story-text');
                    if (!storyText) return;
                    storyText.classList.toggle('expanded');
                    showMoreBtn.textContent = storyText.classList.contains('expanded') ? (currentLang === 'ko' ? '간략히' : 'Show less') : (currentLang === 'ko' ? '더 보기' : 'Show more');
                }
            });
            scrollContainer.addEventListener('dblclick', (e) => {
                const slide = e.target.closest('.slide');
                if (slide) { const idx = parseInt(slide.dataset.index);
                    const likeBtn = slide.querySelector('.like-btn'); if (!isNaN(idx) && likeBtn && !likedStories.has(`story-${idx}`)) toggleLike(idx, likeBtn); }
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); scrollToSlide(activeIndex + 1); }
                else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); scrollToSlide(activeIndex - 1); }
                else if (e.key === 'l') { e.preventDefault();
                    const slide = document.querySelector(`.slide[data-index="${activeIndex}"]`); if (slide) {
                        const lb = slide.querySelector('.like-btn'); if (lb && !likedStories.has(`story-${activeIndex}`)) toggleLike(activeIndex, lb); } }
            });
        }

        function scrollToSlide(index) {
            const clamped = Math.max(0, Math.min(index, allStories.length - 1));
            const slide = document.querySelector(`.slide[data-index="${clamped}"]`);
            if (slide) slide.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ─── LANGUAGE SWITCH ──────────────────────
        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            if (lang === 'ko') {
                badgeText.textContent = '📖 무한 이야기';
                langToggle.textContent = 'English';
                startSub.textContent = '탭하여 경험을 시작하세요';
                document.querySelector('#header .logo .ko').textContent = '릴스페이스';
                document.querySelector('#loadReelSpaceBtn').textContent = '릴스페이스 시작';
            } else {
                badgeText.textContent = '📖 Infinite Stories';
                langToggle.textContent = '한국어';
                startSub.textContent = 'tap to start the experience';
                document.querySelector('#header .logo .ko').textContent = '릴스페이스';
                document.querySelector('#loadReelSpaceBtn').textContent = 'Load ReelSpace';
            }
            rebuildStories();
            buildSlides();
            activeIndex = 0;
            if (audioInitialized) speakStory(0);
        }

        // ─── START BUTTON ──────────────────────────
        loadReelSpaceBtn.addEventListener('click', () => {
            startOverlay.classList.add('hidden');
            startOverlay.classList.add('hidden-display');
            startAudioAndTTS();
        });

        // ─── LANGUAGE TOGGLE ───────────────────────
        langToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            switchLanguage(currentLang === 'en' ? 'ko' : 'en');
        });

        // ─── KEYBOARD SHORTCUT: SPACE / ENTER to load ──
        document.addEventListener('keydown', (e) => {
            if ((e.key === ' ' || e.key === 'Enter') && !startOverlay.classList.contains('hidden')) {
                e.preventDefault();
                loadReelSpaceBtn.click();
            }
        });

        // ─── CLOSE COMMENTS ─────────────────────────
        closeCommentsBtn.addEventListener('click', () => {
            commentOverlay.classList.remove('show');
        });

        // ─── INIT ──────────────────────────────────
        function init() {
            rebuildStories();
            buildSlides();
            setupEvents();
            const firstMusic = getMusicUrl();
            if (firstMusic) {
                bgMusic.src = firstMusic;
                bgMusic.load();
                lastMusicUrl = firstMusic;
                bgMusic.pause();
                bgMusic.currentTime = 0;
            }
            if (window.speechSynthesis) {
                speechSynthesis.getVoices();
                speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
            }
            console.log('🚀 ReelSpace ready – click "Load ReelSpace" to begin.');
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
    })();
</script>
