<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Number Game 2.0</title>

    <!-- Structured Data for SEO - English & Korean (same as before) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "Number Game 2.0",
        "description": "A fun addictive counting game with live rankings, dopamine spikes, and ChillSpace friend integration.",
        "url": "https://chill-space.pages.dev/numbers",
        "genre": ["Casual", "Clicker", "Multiplayer"],
        "inLanguage": ["en", "ko", "fr", "es"],
        "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
        "publisher": {"@type": "Organization", "name": "ChillSpace"}
    }
    </script>
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Game",
        "name": "넘버 게임 2.0",
        "description": "중독성 있는 카운팅 게임! 실시간 순위, 도파민 스파이크, ChillSpace 친구 연동 기능.",
        "url": "https://chill-space.pages.dev/numbers",
        "genre": ["캐주얼", "클리커", "멀티플레이어"],
        "inLanguage": ["ko", "en", "fr", "es"],
        "offers": {"@type": "Offer", "price": "0", "priceCurrency": "USD"},
        "publisher": {"@type": "Organization", "name": "ChillSpace"}
    }
    </script>

    <style>
        /* ... (all previous CSS, plus new additions for video and popup positioning) ... */
        #videoContainer {
            position: relative;          /* not fixed anymore */
            width: 200px;
            max-width: 70vw;
            margin: 0 auto;             /* center horizontally */
            margin-top: 10px;
            pointer-events: none;
            display: none;              /* initially hidden */
        }

        #bgVideo {
            width: 100%;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(255,0,255,0.6), 0 8px 30px rgba(0,0,0,0.7);
            object-fit: cover;
            aspect-ratio: 1/1;
            pointer-events: auto;
            display: none;
            background: #000;
            border: 2px solid rgba(255,255,255,0.4);
        }

        #milestoneToast, #dopamineToast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 200;
            /* both centered now */
        }

        #milestoneToast {
            z-index: 300;  /* milestone over dopamine */
        }

        /* ... rest of CSS ... */
    </style>
</head>
<body>

    <!-- Language selector, popups, video, setup, game, audio as before -->

    <script>
        // ... translations, state, etc. ...

        // Add these variables at the top of your script
        let milestoneVisible = false;
        let dopamineToastVisible = false;

        // Modify the triggerDopamineSpike function to show dopamine toast only if not blocked by milestone
        function triggerDopamineSpike() {
            if (!isGameStarted) return;
            const pct = 30 + Math.floor(Math.random() * 171);
            dopamineSpikeActive = true;
            dopamineSpikeEndTime = Date.now() + 15000;

            const toast = document.getElementById('dopamineToast');
            toast.textContent = `⚡ ${t('dopamineSpike')} ${pct}%! ${t('doubleNumbers')}`;
            toast.style.display = 'block';
            dopamineToastVisible = true;
            updatePlusButtonText();

            if (navigator.vibrate) navigator.vibrate([50, 30, 50, 30, 100]);

            setTimeout(() => {
                dopamineSpikeActive = false;
                toast.style.display = 'none';
                dopamineToastVisible = false;
                updatePlusButtonText();
                scheduleDopamineSpike();
            }, 15000);
        }

        // Modify checkMilestone to hide dopamine toast while milestone is shown, and show again after
        function checkMilestone() {
            const currentIndex = Math.floor(player.score / 100);
            if (currentIndex > lastMilestoneIndex && currentIndex >= 1) {
                const milestone = currentIndex * 100;
                lastMilestoneIndex = currentIndex;

                // Hide dopamine toast temporarily
                const dopToast = document.getElementById('dopamineToast');
                if (dopamineToastVisible) {
                    dopToast.style.display = 'none';
                }

                // Show milestone toast
                const toast = document.getElementById('milestoneToast');
                toast.textContent = `${t('congrats')} ${milestone} ${t('milestoneSuffix')}`;
                toast.style.display = 'block';
                milestoneVisible = true;

                if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);

                setTimeout(() => {
                    toast.style.display = 'none';
                    milestoneVisible = false;
                    // If dopamine spike still active, re-show dopamine toast
                    if (dopamineSpikeActive && dopamineToastVisible) {
                        document.getElementById('dopamineToast').style.display = 'block';
                    }
                }, 2500);
            }
        }

        // Ensure video container is placed correctly in the DOM
        function ensureVideoContainer() {
            // ... as before, but now we want it inside the game div, after leaderboard
            const gameDiv = document.getElementById('game');
            let container = document.getElementById('videoContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'videoContainer';
                container.style.cssText = 'position: relative; width: 200px; max-width: 70vw; margin: 0 auto; margin-top: 10px; pointer-events: none; display: none;';
                gameDiv.appendChild(container);
            } else {
                // Move to gameDiv if not already there
                if (container.parentElement !== gameDiv) {
                    gameDiv.appendChild(container);
                }
            }
            const video = document.getElementById('bgVideo');
            if (video && container && !container.contains(video)) {
                container.appendChild(video);
            }
            // ... style video as before ...
        }

        // Modify checkVideoUpdate to show video container
        function checkVideoUpdate() {
            if (!isGameStarted) return;
            if (bgVideo.style.display === 'block') return;

            const isFirst = getLeader();
            const newSrc = isFirst ? VIDEO_FIRST : VIDEO_OTHER;

            bgVideo.src = newSrc;
            bgVideo.style.display = 'block';
            const container = document.getElementById('videoContainer');
            if (container) container.style.display = 'block';
            bgVideo.play().catch(() => {});
        }

        // ... rest of functions (same as before) ...
    </script>
</body>
</html>
