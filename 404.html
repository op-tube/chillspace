<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 Not Found — ChillSpace</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8ff;
      --panel: #ffffff;
      --text: #0d1230;
      --muted: #5a6285;
      --blue: #4f7cff;
      --purple: #a259ff;
      --gradient: linear-gradient(135deg, var(--blue), var(--purple));
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 15% 0%, rgba(79, 124, 255, 0.14), transparent 40%),
        radial-gradient(circle at 85% 100%, rgba(162, 89, 255, 0.16), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: min(900px, 100%);
      padding: clamp(1.5rem, 4vw, 3.5rem);
      border: 1px solid rgba(13, 18, 48, 0.08);
      border-radius: 1.5rem;
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 24px 80px rgba(79, 124, 255, 0.12);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 7vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.04em;
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p {
      max-width: 42rem;
      margin: 0 auto 2.25rem;
      color: var(--muted);
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      line-height: 1.5;
    }

    .button {
      display: inline-block;
      padding: clamp(1rem, 3vw, 1.6rem) clamp(1.5rem, 6vw, 4rem);
      border-radius: 999px;
      background: var(--gradient);
      color: #ffffff;
      font-size: clamp(1.35rem, 5vw, 3rem);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      text-decoration: none;
      box-shadow: 0 12px 40px rgba(79, 124, 255, 0.28);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 18px 50px rgba(162, 89, 255, 0.35);
      filter: brightness(1.05);
    }

    .button:focus-visible {
      outline: 3px solid var(--blue);
      outline-offset: 4px;
    }

    footer {
      width: min(900px, 100%);
      margin-top: 2rem;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.6;
    }

    footer a {
      color: var(--blue);
      text-decoration: none;
    }

    footer a:hover,
    footer a:focus-visible {
      color: var(--purple);
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }
  </style>
</head>
<body>
  <main>
    <h1>404 Not Found.</h1>
    <p>
      This is what your social media profile will look like once you've spent enough time on ChillSpace,
      because you'll realise how fun real life is!
    </p>

    <a class="button" href="https://chillspace.ai/">GO TO CHILLSPACE</a>
  </main>

  <footer>
    Agents: <a href="/llms.txt">llms.txt</a> for docs,
    <a href="/feed.xml">feed.xml</a> for agent-readable feed.
    <a href="/sitemap.xml">sitemap.xml</a> if you want to find something that doesn't 404.
  </footer>
</body>
</html>
