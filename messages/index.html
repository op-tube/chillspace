<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1B1730">
  <title>ChillSpace Messages</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400..700&family=Inter:wght@400..600&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "ChillSpace Messages",
    "url": "https://chillspace.ai/messages",
    "description": "ChillSpace Messages — chat with your ChillSpace bot friends.",
    "applicationCategory": "CommunicationApplication",
    "operatingSystem": "Any"
  }
  </script>
  <style>
    :root {
      --bg: #1B1730;
      --accent: #FF8966;
      --mint: #7EE0C3;
      --text: #2c1b4d;
      --purple: #6a0dad;
      --purple-dark: #4b0082;
      --danger: #FF6B6B;
      --radius: 18px;
      --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
      --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: var(--font-body);
      background: linear-gradient(270deg, #FFD166, #FF8C42, #9B5DE5, #00BBF9, #00F5D4, #FFD166);
      background-size: 600% 600%; animation: gradientShift 25s ease infinite; color: var(--text);
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    #app {
      max-width: 480px; margin: 0 auto; height: 100dvh; height: var(--app-height, 100dvh);
      display: flex; flex-direction: column; background: rgba(255,255,255,.25);
      backdrop-filter: blur(12px); overflow: hidden; border-radius: 0;
      box-shadow: 0 0 30px rgba(0,0,0,.1); position: relative;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px; padding: 18px 20px;
      border-bottom: 1px solid rgba(255,255,255,.3); position: sticky; top: 0;
      background: rgba(255,255,255,.4); backdrop-filter: blur(10px); z-index: 5;
    }
    .brand {
      font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.02em;
      display: flex; align-items: center; gap: 8px; color: #2c1b4d;
    }
    .brand .dot {
      width: 10px; height: 10px; border-radius: 50%; background: var(--mint);
      box-shadow: 0 0 0 0 rgba(126,224,195,.5); animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 0 0 rgba(126,224,195,.5); }
      50% { box-shadow: 0 0 0 6px rgba(126,224,195,0); }
    }
    .topbar .sub { margin-left: auto; font-size: 13px; color: var(--purple-dark); }
    .back-btn {
      background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer;
      padding: 4px 8px 4px 0; line-height: 1;
    }
    .screen {
      flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto;
      background: transparent;
    }
    .contacts-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .contacts-header h2 { font-family: var(--font-display); font-size: 22px; margin: 0; color: var(--text); }
    .site-footer-link {
      margin-top: 24px; padding-top: 16px; border-top: 1px solid rgba(106,13,173,.2); text-align: center;
    }
    .site-footer-link a { color: var(--purple); font-size: 13px; text-decoration: none; }
    .site-footer-link a:hover { color: var(--purple-dark); }
    .bot-tag {
      display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .04em; color: #1B1730;
      background: #FFD166; border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: middle;
    }
    .avatar.bot {
      background: linear-gradient(135deg, #FFD166, #FF8C42);
    }
    .empty-state {
      margin-top: 40px; text-align: center; color: var(--purple);
      display: flex; flex-direction: column; gap: 8px;
    }
    .empty-state .big { font-size: 42px; }
    .contact-list { display: flex; flex-direction: column; gap: 10px; }
    .contact-row {
      display: flex; align-items: center; gap: 14px; background: #fff;
      border: 1px solid rgba(106,13,173,.2); border-radius: 16px; padding: 13px 15px;
      cursor: pointer; text-align: left; width: 100%; color: var(--purple); font-family: var(--font-body);
    }
    .contact-row:hover { background: #f9f0ff; }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      background: linear-gradient(135deg, #FF8966, #7EE0C3);
      display: flex; align-items: center; justify-content: center; font-weight: 700;
      color: #1B1730; font-family: var(--font-display); flex-shrink: 0;
    }
    .contact-meta { flex: 1; min-width: 0; }
    .contact-name { font-weight: 600; font-size: 15px; color: var(--purple); }
    .contact-preview {
      font-size: 13px; color: var(--purple-dark); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .chat-screen {
      padding: 0; display: flex; flex-direction: column; flex: 1; min-height: 0;
      position: relative; background: rgba(255,255,255,.2);
    }
    .messages {
      flex: 1; min-height: 0; padding: 18px 16px; display: flex; flex-direction: column;
      gap: 10px; overflow-y: auto; background: transparent;
    }
    .bubble-row { display: flex; }
    .bubble-row.me { justify-content: flex-end; }
    .bubble-row.them { justify-content: flex-start; }
    .bubble {
      max-width: 78%; padding: 11px 14px; border-radius: 16px; font-size: 14.5px;
      line-height: 1.5; word-wrap: break-word; overflow-wrap: break-word;
    }
    .bubble-row.me .bubble {
      background: #e60000; color: #000; border-bottom-right-radius: 4px; border: 1px solid rgba(0,0,0,.2);
    }
    .bubble-row.them .bubble {
      background: #fff; color: var(--purple); border-bottom-left-radius: 4px;
      border: 1px solid rgba(106,13,173,.2);
    }
    .bubble .time { display: block; font-size: 10.5px; margin-top: 5px; opacity: .7; }
    .bubble a.chill-link {
      color: var(--purple); text-decoration: underline; text-underline-offset: 2px;
      font-weight: 500; word-break: break-all;
    }
    .bubble-row.me .bubble a.chill-link { color: #000; text-decoration-color: rgba(0,0,0,.5); }
    .bubble a.chill-link:hover { opacity: .8; }
    .bubble-row.me .bubble a.chill-link:visited { color: #000; }
    .empty-chat { margin: auto; text-align: center; color: var(--purple); padding: 20px; }
    .composer {
      display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid rgba(255,255,255,.4);
      background: rgba(255,255,255,.3);
    }
    .composer input {
      flex: 1; min-width: 0; padding: 13px 15px; border-radius: 12px;
      border: 1px solid rgba(106,13,173,.3); background: rgba(255,255,255,.8);
      color: var(--text); font-size: 15px; font-family: var(--font-body); outline: none;
    }
    .composer input:focus { border-color: var(--purple); }
    .composer input::placeholder { color: #8a7aa8; }
    .send-btn {
      background: #e60000; color: #000; border: none; border-radius: 12px;
      width: 46px; flex-shrink: 0; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
    }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }
    .toast {
      position: absolute; left: 50%; bottom: 90px; transform: translateX(-50%);
      background: var(--purple); border: 1px solid rgba(255,255,255,.3); color: #fff;
      padding: 10px 16px; border-radius: 12px; font-size: 13px; max-width: 85%;
      text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,.2); z-index: 15;
      animation: toastIn .2s ease-out;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%,8px); }
      to { opacity: 1; transform: translate(-50%,0); }
    }
    a { color: var(--purple); }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .brand .dot, .toast { animation: none; }
      body { animation: none; background: linear-gradient(270deg, #FFD166, #FF8C42, #9B5DE5, #00BBF9, #00F5D4, #FFD166); }
    }

<script>
(function () {
  "use strict";

  const STORAGE_KEYS = {
    username: "cs_username",
    contacts: "cs_contacts",
    messages: "cs_messages",
    friends: "chillspace_friends"
  };

  function getUsername() {
    return localStorage.getItem(STORAGE_KEYS.username) || "Guest";
  }

  function getChillSpaceFriends() {
    try {
      const raw = localStorage.getItem(STORAGE_KEYS.friends);
      if (!raw) return [];
      const friends = JSON.parse(raw);
      if (!Array.isArray(friends)) return [];
      return friends
        .filter(name => typeof name === "string" && name.trim() !== "")
        .map((name, index) => ({
          id: "bot-" + index + "-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-"),
          name: name.trim(),
          avatar: "✨"
        }));
    } catch (_) {
      return [];
    }
  }

  function updateDailyChallenge() {
    try {
      const raw = localStorage.getItem("chillspace_daily_challenge");
      if (!raw) return;
      const challenge = JSON.parse(raw);
      if (challenge.type !== "send_messages") return;
      if (challenge.progress < challenge.target) {
        challenge.progress = Math.min(challenge.progress + 1, challenge.target);
        localStorage.setItem("chillspace_daily_challenge", JSON.stringify(challenge));
      }
    } catch (_) {
      // Ignore invalid or unavailable challenge data.
    }
  }

  function getAllMessages() {
    try {
      const value = JSON.parse(localStorage.getItem(STORAGE_KEYS.messages));
      return value && typeof value === "object" && !Array.isArray(value) ? value : {};
    } catch (_) {
      return {};
    }
  }

  function saveAllMessages(messages) {
    localStorage.setItem(STORAGE_KEYS.messages, JSON.stringify(messages));
  }

  function contactKey(contact) {
    return contact && contact.channel === "bot" ? "bot:" + contact.botId : "";
  }

  function findContactById(id) {
    const friend = getChillSpaceFriends()
      .map(f => ({ channel: "bot", botId: f.id, name: f.name, avatar: f.avatar }))
      .find(contact => contactKey(contact) === id);
    return friend || null;
  }

  function addMessage(contactId, entry) {
    const all = getAllMessages();
    if (!Array.isArray(all[contactId])) all[contactId] = [];
    all[contactId].push(entry);
    saveAllMessages(all);
  }

  function escapeHtml(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
  }

  function formatTime(timestamp) {
    return new Date(timestamp).toLocaleString([], {
      month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
    });
  }

  function renderMessageWithLinks(text) {
    const escaped = escapeHtml(text);
    const urlRegex = /(?:https?:\/\/)?(?:www\.)?chill-space\.pages\.dev[^\s<>"']*/gi;
    return escaped.replace(urlRegex, match => {
      let trimmed = match;
      while (trimmed.length && /[.,;:]$/.test(trimmed)) trimmed = trimmed.slice(0, -1);
      if (!trimmed) return match;
      const href = /^https?:\/\//i.test(trimmed) ? trimmed : "https://" + trimmed;
      return '<a href="' + href + '" target="_blank" rel="noopener noreferrer" class="chill-link">' + trimmed + "</a>" +
        match.slice(trimmed.length);
    });
  }

      "Your pet is adorable!", "Animals make life better.", "I'm thinking of adopting a pet.",

  function generateBotReply(userText) {
    const lower = (userText || "").toLowerCase();
    const topic = Object.keys(SPECIFIC_BOT_RESPONSES).find(key => lower.includes(key));
    const pool = topic ? SPECIFIC_BOT_RESPONSES[topic] : GENERIC_BOT_MESSAGES;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  const state = { view: "contacts", activeContactId: null, toast: null };
  const app = document.getElementById("app");
  let toastTimer = null;

  function showToast(message) {
    state.toast = message;
    render();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      state.toast = null;
      render();
    }, 3000);
  }

  function render() {
    app.innerHTML = "";
    if (state.view === "chat") renderChat();
    else renderContacts();
  }

  function renderContacts() {
    const topbar = document.createElement("div");
    topbar.className = "topbar";
    topbar.innerHTML = '<div class="brand"><span class="dot"></span> ChillSpace Friends</div>' +
      '<div class="sub">@' + escapeHtml(getUsername()) + "</div>";
    app.appendChild(topbar);

    const screen = document.createElement("div");
    screen.className = "screen";
    const allMessages = getAllMessages();
    const decorated = getChillSpaceFriends().map(friend => {
      const contact = { channel: "bot", botId: friend.id, name: friend.name, avatar: friend.avatar };
      const id = contactKey(contact);
      const messages = Array.isArray(allMessages[id]) ? allMessages[id] : [];
      const last = messages.length ? messages[messages.length - 1] : null;
      return { contact, id, last };
    }).sort((a, b) => (b.last ? b.last.ts : -Infinity) - (a.last ? a.last.ts : -Infinity));

    let content;
    if (decorated.length) {
      content = '<div class="section-title">ChillSpace Friends</div><div class="contact-list">' +
        decorated.map(({ contact, id, last }) => {
          const preview = last ? (last.dir === "sent" ? "You: " : "") + last.text : "Tap to chat with " + contact.name + "!";
          const initial = contact.name.trim().charAt(0).toUpperCase() || "?";
          return '<button class="contact-row" data-id="' + escapeHtml(id) + '">' +
            '<div class="avatar bot">' + escapeHtml(initial) + '</div><div class="contact-meta">' +
            '<div class="contact-name">' + escapeHtml(contact.name) + '<span class="bot-tag">AI FRIEND</span></div>' +
            '<div class="contact-preview">' + escapeHtml(preview) + "</div></div></button>";
        }).join("") + "</div>";
    } else {
      content = '<div class="empty-state"><div class="big">🌙</div>' +
        '<div>No ChillSpace Friends yet.</div><div>Add bot friends to your ChillSpace account to start chatting.</div></div>';
    }

    screen.innerHTML = '<div class="contacts-header"><h2>Messages</h2></div>' + content +
      '<div class="site-footer-link"><a href="/">🌐 Visit ChillSpace Feed ↗</a></div>';
    app.appendChild(screen);

    screen.querySelectorAll(".contact-row").forEach(button => {
      button.addEventListener("click", () => {
        state.activeContactId = button.getAttribute("data-id");
        state.view = "chat";
        render();
      });
    });
  }

  function renderChat() {
    const contact = findContactById(state.activeContactId);
    if (!contact) {
      state.view = "contacts";
      state.activeContactId = null;
      render();
      return;
    }

    const topbar = document.createElement("div");
    topbar.className = "topbar";
    topbar.innerHTML = '<button class="back-btn" id="chat-back" aria-label="Back">←</button>' +
      '<div class="brand">' + escapeHtml(contact.name) + '</div><div class="sub">ChillSpace Bot</div>';
    app.appendChild(topbar);

    const chatScreen = document.createElement("div");
    chatScreen.className = "chat-screen";
    const messages = getAllMessages()[contactKey(contact)] || [];
    let messagesHtml;
    if (!messages.length) {
      messagesHtml = '<div class="empty-chat">No messages yet with ' + escapeHtml(contact.name) + '. Say hello!</div>';
    } else {
      messagesHtml = messages.map(message =>
        '<div class="bubble-row ' + (message.dir === "sent" ? "me" : "them") + '"><div class="bubble">' +
        renderMessageWithLinks(message.text) + '<span class="time">' + escapeHtml(formatTime(message.ts)) +
        "</span></div></div>"
      ).join("");
    }

    chatScreen.innerHTML = '<div class="messages" id="messages-pane">' + messagesHtml + '</div>' +
      '<div class="composer"><input id="chat-input" type="text" placeholder="Message your bot friend..." maxlength="500" autocomplete="off">' +
      '<button class="send-btn" id="chat-send" aria-label="Send message">➤</button></div>';
    app.appendChild(chatScreen);

    if (state.toast) {
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = state.toast;
      chatScreen.appendChild(toast);
    }

    const pane = document.getElementById("messages-pane");
    pane.scrollTop = pane.scrollHeight;

    document.getElementById("chat-back").addEventListener("click", () => {
      state.view = "contacts";
      state.activeContactId = null;
      render();
    });

    const input = document.getElementById("chat-input");
    const sendButton = document.getElementById("chat-send");

    function trySend() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      sendMessageToBot(contact, text);
    }

    sendButton.addEventListener("click", trySend);
    input.addEventListener("keydown", event => {
      if (event.key === "Enter") trySend();
    });
    input.addEventListener("focus", () => {
      setTimeout(() => input.scrollIntoView({ block: "end", behavior: "smooth" }), 250);
    });
  }

  function sendMessageToBot(contact, text) {
    if (navigator.vibrate) navigator.vibrate(50);
    const id = contactKey(contact);
    addMessage(id, { dir: "sent", text, ts: Date.now() });
    updateDailyChallenge();
    render();

    setTimeout(() => {
      const reply = generateBotReply(text);
      addMessage(id, { dir: "received", text: reply, ts: Date.now() });
      if (state.view === "chat" && state.activeContactId === id) render();
      else showToast(contact.name + " replied.");
    }, 1000 + Math.random() * 1000);
  }

  function setupViewportTracking() {
    if (!window.visualViewport) return;
    const viewport = window.visualViewport;
    function update() {
      document.documentElement.style.setProperty("--app-height", viewport.height + "px");
    }
    viewport.addEventListener("resize", update);
    viewport.addEventListener("scroll", update);
    update();
  }

  function init() {
    setupViewportTracking();
    render();
  }

  init();
})();
</script>
</body>
</html>
