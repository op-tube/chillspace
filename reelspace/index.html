<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ============================================================
    METHOD 1: META REFRESH (works even with JavaScript disabled)
    ============================================================ -->
    <!-- Redirect after 3 seconds. Change "3" to "0" for instant. -->
    <meta http-equiv="refresh" content="3; url=https://chillspace.ai/rs" />

    <title>Redirecting…</title>

    <style>
        /* ── just a little polish ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            padding: 1.5rem;
        }

        .card {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            padding: 2.5rem 2rem;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            text-align: center;
            border: 1px solid #e9edf2;
        }

        .spinner {
            width: 44px;
            height: 44px;
            margin: 0 auto 1.25rem;
            border: 4px solid #e2e8f0;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0b1a33;
            margin-bottom: 0.4rem;
        }

        p {
            color: #475569;
            line-height: 1.6;
            margin-top: 0.25rem;
        }

        .url {
            display: inline-block;
            background: #f1f4f9;
            padding: 0.2rem 0.9rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1e293b;
            margin: 0.5rem 0 1rem;
            word-break: break-all;
        }

        .fallback-link {
            display: inline-block;
            margin-top: 1.25rem;
            padding: 0.6rem 1.8rem;
            background: #2563eb;
            color: white;
            font-weight: 500;
            text-decoration: none;
            border-radius: 60px;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .fallback-link:hover {
            background: #1d4ed8;
        }

        .note {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            border-top: 1px solid #eef2f6;
            padding-top: 1.25rem;
        }

        .note code {
            background: #f1f4f9;
            padding: 0.1rem 0.5rem;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #1e293b;
        }
    </style>
</head>
<body>

    <div class="card">

        <!-- ─── spinner ─── -->
        <div class="spinner" aria-hidden="true"></div>

        <!-- ─── message ─── -->
        <h1>Redirecting you&hellip;</h1>
        <p>You&rsquo;ll be sent to</p>
        <span class="url" id="destinationDisplay">https://chillspace.ai/rs</span>

        <!-- ─── fallback link (in case nothing auto-redirects) ─── -->
        <a href="https://chillspace.ai/rs" class="fallback-link" id="fallbackLink">
            Go to the new ReelSpace now &rarr;
        </a>

        <div class="note">
            ⚡ <strong>ReelSpace is now at https://chillspace.ai/rs/</strong>
        </div>
    </div>

    <!-- ============================================================
    METHOD 2: JAVASCRIPT REDIRECT (faster, more control)
    ============================================================ -->
    <script>
        (function() {

            // ─── where to go ──────────────────────────────────────────
            const TARGET_URL = 'https://chillspace.ai/rs';

            // ─── update the displayed URL in the UI ──────────────────
            document.getElementById('destinationDisplay').textContent = TARGET_URL;
            document.getElementById('fallbackLink').href = TARGET_URL;

            // ─── redirect after a short delay (matches meta refresh) ─
            //     set to 0 for instant, or keep 3000ms to match the
            //     meta refresh delay (3 seconds)
            const DELAY_MS = 3000; // 3 seconds

            setTimeout(() => {
                window.location.href = TARGET_URL;
            }, DELAY_MS);

            // ─── (optional) log it ──────────────────────────────────
            console.log(`🔄 Redirecting to ${TARGET_URL} in ${DELAY_MS}ms`);

        })();
    </script>

</body>
</html>
